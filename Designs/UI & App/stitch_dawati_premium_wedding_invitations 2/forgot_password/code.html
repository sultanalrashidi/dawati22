            box-shadow: 0 10px 40px rgba(229, 211, 179, 0.15); /* primary-container tint */

<body class="bg-background text-on-background antialiased min-h-screen flex flex-col items-center justify-center p-margin-mobile md:p-margin-desktop relative overflow-hidden">
<!-- Subtle Background Decoration -->
<div class="absolute top-0 right-0 w-1/2 h-1/2 bg-surface-container-low rounded-bl-full opacity-50 blur-3xl -z-10"></div>
<div class="absolute bottom-0 left-0 w-1/3 h-1/3 bg-primary-fixed-dim rounded-tr-full opacity-20 blur-3xl -z-10"></div>
<div class="w-full max-w-[440px] bg-surface rounded-xl p-md md:p-lg glow-shadow border border-surface-container-high relative z-10 text-center flex flex-col items-center">
<!-- Logo / Icon Area -->
<div class="w-16 h-16 rounded-full bg-surface-container flex items-center justify-center mb-lg">
<span aria-hidden="true" class="material-symbols-outlined text-primary text-3xl" data-icon="lock_reset" style="font-variation-settings: 'FILL' 0;">
                lock_reset
            </span>
</div>
<h1 class="font-headline-md text-headline-md text-on-surface mb-xs md:font-display-lg md:text-display-lg md:mb-sm">
            Forgot Password
        </h1>
<p class="font-body-md text-body-md text-on-surface-variant mb-lg max-w-[320px]">
            Enter the email address associated with your account, and we’ll send you a link to reset your password.
        </p>
<form action="#" class="w-full flex flex-col gap-lg" method="POST">
<div class="relative w-full text-left">
<label class="font-label-sm text-label-sm text-on-surface-variant block mb-unit uppercase tracking-widest" for="email">
                    Email Address
                </label>
<div class="relative">
<span class="absolute inset-y-0 left-0 flex items-center text-outline-variant">
<span aria-hidden="true" class="material-symbols-outlined ml-0 text-xl" data-icon="mail" style="font-variation-settings: 'FILL' 0;">
                            mail
                        </span>
</span>
<input class="w-full bg-transparent border-0 border-b border-surface-variant focus:border-b-2 py-sm pl-8 pr-0 font-body-md text-body-md text-on-surface placeholder:text-outline-variant transition-colors input-minimal" dir="ltr" id="email" name="email" placeholder="you@example.com" required="" type="email"/>
</div>
</div>
<button class="w-full bg-primary-container text-on-primary-container font-label-sm text-label-sm uppercase tracking-widest py-sm px-md rounded-DEFAULT hover:opacity-90 transition-opacity btn-scale flex items-center justify-center gap-xs mt-sm" type="submit">
<span>Send Reset Link</span>
<span aria-hidden="true" class="material-symbols-outlined text-lg" data-icon="arrow_forward" style="font-variation-settings: 'FILL' 0;">
                    arrow_forward
                </span>
</button>
</form>
<div class="mt-lg border-t border-surface-variant/20 pt-md w-full flex justify-center">
<a class="font-label-sm text-label-sm text-on-surface-variant hover:text-primary transition-colors flex items-center gap-xs" href="#">
<span aria-hidden="true" class="material-symbols-outlined text-sm" data-icon="arrow_back" style="font-variation-settings: 'FILL' 0;">
                    arrow_back
                </span>
                Back to Sign In
            </a>
</div>
</div>
