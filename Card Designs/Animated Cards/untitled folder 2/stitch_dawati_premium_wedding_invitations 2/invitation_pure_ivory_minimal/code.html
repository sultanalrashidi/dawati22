<style>
        /* Custom delicate animations for high-end feel */
        .reveal-up {
            opacity: 0;
            transform: translateY(20px);
            transition: opacity 1.2s cubic-bezier(0.16, 1, 0.3, 1), transform 1.2s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .reveal-up.active {
            opacity: 1;
            transform: translateY(0);
        }
        
        /* Thin elegant line separator */
        .elegant-line {
            width: 1px;
            height: 60px;
            background: linear-gradient(to bottom, transparent, var(--color-outline-variant), transparent);
        }
        
        .elegant-line-horizontal {
            height: 1px;
            width: 80px;
            background: linear-gradient(to right, transparent, var(--color-outline-variant), transparent);
        }
    </style>

<body class="relative flex flex-col items-center w-full min-h-screen bg-surface-bright text-on-surface font-body-md font-light">
<!-- Cover View (Splash) -->
<section class="fixed inset-0 z-50 flex flex-col items-center justify-center w-full h-screen bg-surface-bright transition-all duration-[1500ms] ease-in-out" id="cover-screen">
<div class="flex flex-col items-center text-center space-y-lg px-gutter">
<p class="font-body-md text-body-md text-on-surface-variant tracking-[0.3em] uppercase">
                دعوة زفاف
            </p>
<!-- Absolute minimal name display, English for high-end contrast -->
<div class="py-sm" dir="ltr">
<h1 class="font-display-lg-mobile md:font-display-lg text-display-lg-mobile md:text-display-lg text-on-surface tracking-widest whitespace-nowrap">
                    SARA <span class="font-light mx-2">&amp;</span> MOHAMMED
                </h1>
</div>
<!-- Delicate action trigger -->
<button class="group mt-xl flex flex-col items-center gap-sm cursor-pointer border-none bg-transparent outline-none" onclick="revealInvitation()">
<span class="font-label-sm text-label-sm text-on-surface-variant tracking-[0.2em] group-hover:text-primary transition-colors duration-500">
                    اضغط لفتح الدعوة
                </span>
<div class="w-[1px] h-16 bg-outline-variant group-hover:h-24 transition-all duration-700 ease-in-out origin-top"></div>
</button>
</div>
</section>
<!-- Main Invitation Content (Hidden initially) -->
<main class="w-full max-w-2xl mx-auto min-h-screen px-gutter py-margin-desktop flex flex-col items-center text-center opacity-0 pointer-events-none transition-opacity duration-[2000ms] ease-in-out" id="main-invitation">
<!-- Opening Sentiment -->
<div class="w-full flex justify-center mb-md reveal-up delay-100">
<span class="material-symbols-outlined text-outline-variant text-3xl font-light" style="font-variation-settings: 'wght' 200;">favorite</span>
</div>
<p class="font-body-lg text-body-lg text-on-surface max-w-md mx-auto leading-loose reveal-up delay-200">
            يسرنا دعوتكم لمشاركتنا فرحتنا وحضور حفل زفافنا
        </p>
<div class="elegant-line-horizontal my-lg reveal-up delay-300 bg-outline-variant/30"></div>
<!-- Couple Names -->
<div class="reveal-up delay-400 my-md" dir="ltr">
<h2 class="font-display-lg-mobile md:font-display-lg text-display-lg-mobile md:text-display-lg text-on-surface tracking-widest">
                SARA <br/><span class="text-3xl text-outline-variant/60 font-light block my-4">&amp;</span> MOHAMMED
            </h2>
</div>
<div class="elegant-line-horizontal my-lg reveal-up delay-500 bg-outline-variant/30"></div>
<!-- Guest Addressee -->
<div class="reveal-up delay-600 my-sm flex flex-col items-center gap-2">
<span class="font-label-sm text-label-sm text-on-surface-variant tracking-widest">دعوة خاصة إلى</span>
<p class="font-headline-md text-headline-md text-on-surface">أم فلان</p>
</div>
<div class="elegant-line my-lg reveal-up delay-700 bg-outline-variant/30"></div>
<!-- Details Grid (Vertical List) -->
<div class="flex flex-col items-center gap-lg reveal-up delay-800 w-full">
<div class="flex flex-col items-center gap-1">
<span class="font-label-sm text-label-sm text-on-surface-variant tracking-[0.2em] uppercase">اليوم والتاريخ</span>
<p class="font-body-lg text-body-lg text-on-surface">الخميس، ٢٤ أكتوبر ٢٠٢٤</p>
</div>
<div class="flex flex-col items-center gap-1">
<span class="font-label-sm text-label-sm text-on-surface-variant tracking-[0.2em] uppercase">الوقت</span>
<p class="font-body-lg text-body-lg text-on-surface">التاسعة مساءً</p>
</div>

</div>
</div>

</div>
</div>

                تأكيد الحضور
            </button>
</div>
</main>
<script>
        function revealInvitation() {
            const cover = document.getElementById('cover-screen');
            const main = document.getElementById('main-invitation');
            
            // Fade out cover, scroll it up slightly
            cover.style.opacity = '0';
            cover.style.transform = 'translateY(-5vh)';
            cover.style.pointerEvents = 'none';
            
            // Show main content
            setTimeout(() => {
                cover.classList.add('hidden');
                main.classList.remove('opacity-0', 'pointer-events-none');
                
                // Trigger reveal animations sequentially
                const revealElements = document.querySelectorAll('.reveal-up');
                revealElements.forEach((el, index) => {
                    setTimeout(() => {
                        el.classList.add('active');
                    }, index * 150); // Staggered delay
                });
                
                // Scroll to top just in case
                window.scrollTo({ top: 0, behavior: 'smooth' });
                
            }, 1200); // Wait for cover fade out
        }
    </script>
