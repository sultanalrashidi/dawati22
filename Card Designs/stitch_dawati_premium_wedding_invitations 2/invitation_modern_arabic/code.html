<!DOCTYPE html>

<html dir="rtl" lang="ar"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Modern Arabic Wedding Invitation</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400;1,700&amp;family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&amp;family=Playfair+Display:ital,wght@0,400..900;1,400..900&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "on-secondary-container": "#795354",
                        "on-secondary-fixed": "#2f1314",
                        "secondary": "#7b5455",
                        "primary": "#6a5d43",
                        "surface-container-highest": "#e4e2e1",
                        "outline-variant": "#cec5b9",
                        "tertiary": "#5b5d6e",
                        "error": "#ba1a1a",
                        "secondary-fixed": "#ffdad9",
                        "on-error": "#ffffff",
                        "surface-variant": "#e4e2e1",
                        "secondary-container": "#fdcbcb",
                        "secondary-fixed-dim": "#ecbbba",
                        "primary-container": "#e5d3b3",
                        "inverse-on-surface": "#f3f0f0",
                        "error-container": "#ffdad6",
                        "on-background": "#1b1c1c",
                        "surface-dim": "#dcd9d9",
                        "inverse-primary": "#d6c4a5",
                        "on-secondary": "#ffffff",
                        "on-primary-container": "#675a41",
                        "on-tertiary-fixed-variant": "#434656",
                        "on-primary": "#ffffff",
                        "on-error-container": "#93000a",
                        "tertiary-fixed": "#e0e1f5",
                        "primary-fixed": "#f3e0c0",
                        "on-surface": "#1b1c1c",
                        "outline": "#7d766c",
                        "surface-tint": "#6a5d43",
                        "on-tertiary": "#ffffff",
                        "background": "#fcf9f8",
                        "on-primary-fixed": "#231a06",
                        "primary-fixed-dim": "#d6c4a5",
                        "on-primary-fixed-variant": "#51452d",
                        "surface-container": "#f0eded",
                        "surface-container-high": "#eae7e7",
                        "on-tertiary-container": "#595b6c",
                        "tertiary-fixed-dim": "#c4c5d9",
                        "surface": "#fcf9f8",
                        "on-tertiary-fixed": "#181b29",
                        "surface-container-lowest": "#ffffff",
                        "on-secondary-fixed-variant": "#603d3e",
                        "surface-bright": "#fcf9f8",
                        "on-surface-variant": "#4c463d",
                        "tertiary-container": "#d3d4e8",
                        "inverse-surface": "#303030",
                        "surface-container-low": "#f6f3f2"
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    spacing: {
                        "xl": "80px",
                        "sm": "16px",
                        "unit": "4px",
                        "lg": "48px",
                        "md": "24px",
                        "xs": "8px",
                        "margin-desktop": "120px",
                        "margin-mobile": "20px",
                        "gutter": "20px"
                    },
                    fontFamily: {
                        "headline-md": ["Playfair Display"],
                        "label-sm": ["DM Sans"],
                        "body-lg": ["DM Sans"],
                        "display-lg-mobile": ["Playfair Display"],
                        "display-lg": ["Playfair Display"],
                        "body-md": ["DM Sans"],
                        "arabic": ["Amiri", "serif"]
                    },
                    fontSize: {
                        "headline-md": ["24px", { "lineHeight": "1.3", "fontWeight": "500" }],
                        "label-sm": ["12px", { "lineHeight": "1.0", "letterSpacing": "0.05em", "fontWeight": "500" }],
                        "body-lg": ["18px", { "lineHeight": "1.6", "fontWeight": "400" }],
                        "display-lg-mobile": ["32px", { "lineHeight": "1.2", "fontWeight": "600" }],
                        "display-lg": ["48px", { "lineHeight": "1.1", "letterSpacing": "-0.02em", "fontWeight": "600" }],
                        "body-md": ["16px", { "lineHeight": "1.5", "fontWeight": "400" }]
                    }
                }
            }
        }
    </script>
<style>
        .aspect-9-16 {
            aspect-ratio: 9 / 16;
        }
        .bg-pattern {
            background-image: radial-gradient(#cec5b9 1px, transparent 1px);
            background-size: 20px 20px;
        }
    </style>
</head>
<body class="bg-surface-container-low min-h-screen flex items-center justify-center p-4">
<!-- Standalone Invitation Card -->
<div class="relative w-full max-w-[400px] aspect-9-16 bg-surface rounded-xl overflow-hidden shadow-2xl flex flex-col items-center justify-between py-12 px-8">
<!-- Subtle Background Pattern -->
<div class="absolute inset-0 bg-pattern opacity-10 pointer-events-none"></div>
<!-- Geometric Corner Accents -->
<div class="absolute top-4 left-4 w-12 h-12 border-t border-l border-primary opacity-30"></div>
<div class="absolute top-4 right-4 w-12 h-12 border-t border-r border-primary opacity-30"></div>
<div class="absolute bottom-4 left-4 w-12 h-12 border-b border-l border-primary opacity-30"></div>
<div class="absolute bottom-4 right-4 w-12 h-12 border-b border-r border-primary opacity-30"></div>
<!-- Header -->
<div class="text-center z-10 w-full space-y-4">
<p class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-[0.2em] mb-8">دعوة زفاف</p>
<!-- Guest Name -->
<div class="inline-block border-b border-primary pb-2 px-8">
<p class="font-body-md text-body-md text-on-surface">إلى السيدة الفاضلة</p>
<p class="font-headline-md text-headline-md text-primary mt-2">أم خالد</p>
</div>
<p class="font-body-md text-body-md text-on-surface-variant mt-6">نتشرف بدعوتكم لحضور حفل زفاف</p>
</div>
<!-- Main Calligraphy / Typography -->
<div class="text-center z-10 my-8">
<h1 class="font-arabic text-6xl md:text-7xl text-primary leading-tight">
                سارة <br/>
<span class="text-on-surface-variant opacity-50">&amp;</span> <br/>
                محمد
            </h1>
</div>
<!-- Details -->
<div class="text-center z-10 w-full space-y-6">
<div>
<p class="font-body-md text-body-md text-on-surface">الجمعة، ١٥ سبتمبر ٢٠٢٤</p>
<p class="font-body-md text-body-md text-on-surface-variant">الساعة الثامنة مساءً</p>
</div>
<div class="w-8 h-px bg-outline-variant mx-auto"></div>
<div>
<p class="font-body-md text-body-md text-on-surface">فندق الريتز كارلتون</p>
<p class="font-body-md text-body-md text-on-surface-variant">قاعة الاحتفالات الكبرى</p>
</div>
</div>
<!-- Footer / Action -->
<div class="z-10 w-full mt-8 flex flex-col items-center">
<button class="bg-primary-container text-on-primary-container px-8 py-3 rounded-full font-label-sm text-label-sm uppercase tracking-widest hover:scale-95 transition-transform duration-200">
                تأكيد الحضور
            </button>
</div>
</div>
</body></html>
