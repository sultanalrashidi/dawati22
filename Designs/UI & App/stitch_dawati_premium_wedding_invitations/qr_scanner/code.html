<style>
    /* Utility for scanner overlay */
    .scanner-overlay {
        background: radial-gradient(circle, transparent 20%, rgba(0,0,0,0.7) 80%);
    }
    
    .scanner-box {
        position: relative;
    }
    .scanner-box::before,
    .scanner-box::after {
        content: '';
        position: absolute;
        width: 40px;
        height: 40px;
        border: 4px solid var(--tw-colors-primary-container);
        border-radius: 8px;
    }
    
    .scanner-box::before {
        top: -4px;
        left: -4px;
        border-right: none;
        border-bottom: none;
    }
    
    .scanner-box::after {
        bottom: -4px;
        right: -4px;
        border-left: none;
        border-top: none;
    }
    
    .scanner-box-inner::before,
    .scanner-box-inner::after {
        content: '';
        position: absolute;
        width: 40px;
        height: 40px;
        border: 4px solid var(--tw-colors-primary-container);
        border-radius: 8px;
    }
    
    .scanner-box-inner::before {
        top: -4px;
        right: -4px;
        border-left: none;
        border-bottom: none;
    }
    
    .scanner-box-inner::after {
        bottom: -4px;
        left: -4px;
        border-right: none;
        border-top: none;
    }

    /* Scanning line animation */
    @keyframes scan {
        0% { transform: translateY(0); opacity: 0; }
        10% { opacity: 1; }
        90% { opacity: 1; }
        100% { transform: translateY(240px); opacity: 0; }
    }
    .scan-line {
        animation: scan 2s linear infinite;
    }
</style>
</head>
