<style>

<body class="bg-background text-on-background font-body-md min-h-screen relative overflow-x-hidden antialiased">

<!-- Main Editorial Canvas -->

                أم فلان
            </p>

<!-- The Names (Editorial Lockup) -->

</div>
<!-- Abstract Image Element -->
<div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[120%] h-[150%] md:w-[800px] md:h-[400px] -z-10 opacity-40">
<div class="bg-cover bg-center w-full h-full rounded-full blur-3xl mix-blend-multiply" data-alt="A soft, abstract floral composition in muted blush and champagne tones. The petals blur gently into the background, creating a high-fashion, editorial wedding aesthetic that feels luxurious and serene. Shot with soft studio lighting, delicate shadows, and a shallow depth of field, minimalist and elegant." style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuCIqjwUUmAnz_rPhzuwqjN-sqjjhNPHXAjIU2dg6cPwZh8I6mygMLdVlihQRG_7iyxJr-ax8LD9sWasnOT43XHARjXYDkORSclztr6CpqOPJQ0HrIAqqhsFbsblZUGvDFhq0QEG7e1u9NbyOxGP5LejJW_BTFQSGhwrkxVJzCkao6xapb4Eg7TYZCP4iWRCWmgZLzS56DOUS-INIpSuR1CPFDRuO4e-dGAzoy53P1CqMlkL5m7ZjpMM')"></div>
</div>

<!-- Details Grid -->

<!-- Date -->

<script>
        // Simple reveal animation for editorial feel
        document.addEventListener('DOMContentLoaded', () => {
            const reveals = document.querySelectorAll('.reveal-section, .fade-in');
            
            reveals.forEach((el, index) => {
                el.style.opacity = '0';
                el.style.transform = 'translateY(20px)';
                el.style.transition = 'opacity 1s ease-out, transform 1s cubic-bezier(0.16, 1, 0.3, 1)';
                
                setTimeout(() => {
                    el.style.opacity = '1';
                    el.style.transform = 'translateY(0)';
                }, 150 * (index + 1));
            });
        });
    </script>
