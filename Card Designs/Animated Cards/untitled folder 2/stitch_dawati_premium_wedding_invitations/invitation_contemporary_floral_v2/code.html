<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 24;
        }
        .bloom-reveal {
            opacity: 0;
            animation: bloom 1.5s cubic-bezier(0.4, 0, 0.2, 1) forwards;
            animation-delay: 0.2s;
        }
        .bloom-reveal-delayed {
            opacity: 0;
            animation: bloom 1.5s cubic-bezier(0.4, 0, 0.2, 1) forwards;
            animation-delay: 0.5s;
        }

        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #fcf9f8; 
        }
        ::-webkit-scrollbar-thumb {
            background: #cec5b9; 
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #e5d3b3;

<!-- Ambient Background Elements -->
<div class="fixed inset-0 pointer-events-none overflow-hidden z-0">
<!-- Soft top right gradient -->
<div class="absolute -top-40 -right-40 w-[600px] h-[600px] bg-secondary-fixed/20 rounded-full blur-[100px]"></div>
<!-- Soft bottom left gradient -->
<div class="absolute -bottom-40 -left-40 w-[600px] h-[600px] bg-primary-fixed/20 rounded-full blur-[100px]"></div>
</div>
<!-- Main Content Canvas -->
<main class="relative z-10 max-w-7xl mx-auto min-h-screen flex flex-col items-center justify-center p-margin-mobile md:p-margin-desktop">
<!-- Invitation Card Wrapper -->
<div class="w-full max-w-2xl bloom-reveal">
<div class="bg-surface/60 backdrop-blur-3xl border border-surface-variant/50 rounded-2xl shadow-[0_40px_100px_rgba(229,211,179,0.05)] overflow-hidden relative">

<div class="absolute top-0 right-0 w-48 h-48 pointer-events-none opacity-80 mix-blend-multiply">
<img class="w-full h-full object-cover" data-alt="A delicate, highly detailed illustration of a single contemporary dusty rose peony branch extending from the top right corner. The style is modern editorial, with soft champagne accents, minimal lines, and a light-mode friendly watercolor texture. Serene and sophisticated mood." src="https://lh3.googleusercontent.com/aida-public/AB6AXuBVWjhWf6Md1GKJ8KGSoIGRfMly7T4IRX68HDsqhPS3vWLWQK6SL-JCltl672ujVBSJgj_qY2Sb8KLU7FWfwPkOWU8JixDMdME14P_6hFCIL-eW5Y70jdxHRzB_eJxVpF2Wh4JEZiuyZlaHQ9iYS4_m5jGlWrynvSc5L5p98Vizqf7WKVkAmKpe5Ta-sdIwmukBoyEDCnMYBQ6GdSlO9_YJ4uaeLOXIvLmdQXfZi2yKDM6bzN0IBZiE"/>
</div>

<div class="absolute bottom-0 left-0 w-48 h-48 pointer-events-none opacity-80 mix-blend-multiply origin-bottom-left">
<img class="w-full h-full object-cover" data-alt="A minimal, elegant sprig of modern champagne and dusty rose foliage emerging from the bottom left corner. Soft focus, editorial quality botanical art with plenty of negative space. Designed for a high-end luxury light-mode layout." src="https://lh3.googleusercontent.com/aida-public/AB6AXuAZnbPkaBKYxM8TDt2YUloA0PldyG4bIgGIX6PY5-J1_1B1gtr0jRpzmwIJKUASpJXP9xH-lnUj785jii5663z5iHR8nyOR5CgE-jSgo-yMRFtU9L2qM5tjj4Z_2YIdsKona-gFq95w9upP73Rm-BYucCpgRRxD8AWmxL92eQJzE-yR9BrxnYkXw9OFqnKTIa_tQ7GJE956cggyKhj3S_9THeJols3A-PFCRfG_4qrEWiIGfNdtnYDj"/>
</div>
<div class="p-lg md:p-xl relative z-10 text-center flex flex-col items-center">
<!-- Guest Greeting -->
<div class="mb-sm bloom-reveal-delayed">
<span class="font-body-md text-body-md text-on-surface-variant tracking-widest uppercase">To Our Honored Guest</span>
<h2 class="font-headline-md text-headline-md-mobile md:text-headline-md text-primary mt-2" dir="rtl">أم فلان</h2>
</div>
<div class="w-12 h-px bg-outline-variant/30 my-md"></div>
<!-- Invitation Text -->
<div class="mb-lg bloom-reveal-delayed">
<p class="font-body-lg text-body-lg text-on-surface-variant italic mb-sm">Joyfully invite you to celebrate the marriage of</p>
<h1 class="font-display-lg text-display-lg-mobile md:text-display-lg text-on-background mt-sm mb-xs">SARA <span class="text-secondary">&amp;</span> MOHAMMED</h1>
</div>
<!-- Event Details Bento-style Grid -->

<div class="bg-surface-bright/50 border border-surface-variant rounded-lg p-sm flex flex-col items-center justify-center hover:bg-surface transition-colors cursor-default">
<span class="material-symbols-outlined text-secondary mb-2" style="font-variation-settings: 'FILL' 0;">event</span>
<span class="font-label-sm text-label-sm text-on-surface-variant tracking-widest uppercase mb-1">Saturday</span>
<span class="font-headline-md text-headline-md-mobile text-on-background">24</span>
<span class="font-label-sm text-label-sm text-on-surface-variant uppercase mt-1">November 2024</span>
</div>

<span class="material-symbols-outlined text-secondary mb-2" style="font-variation-settings: 'FILL' 0;">location_on</span>
<span class="font-label-sm text-label-sm text-on-surface-variant tracking-widest uppercase mb-1">Reception</span>
<span class="font-body-md text-body-md text-on-background text-center mt-2">The Ritz-Carlton<br/>Grand Ballroom</span>
</div>
</div>

<span class="material-symbols-outlined" style="font-size: 18px;">check_circle</span>
                            Accept
                        </button>
<button class="flex-1 bg-transparent border border-outline-variant text-on-surface-variant font-label-sm text-label-sm py-4 px-6 rounded-lg uppercase tracking-widest hover:bg-surface-variant/20 hover:scale-[0.98] transition-all duration-200 active:scale-95 flex items-center justify-center gap-2">
<span class="material-symbols-outlined" style="font-size: 18px;">cancel</span>
                            Decline
                        </button>
</div>
</div>
</div>
</div>
