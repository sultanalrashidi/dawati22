<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>مشاهد الطريق</title>
<!--
  مشاهد كاروسيل «لوحات الطرق» مرسومة بالكود (ليست صوراً حقيقية ولا مولّدة).
  ?scene=1 … ?scene=4 يرسم مشهداً واحداً 1080×1920 (يصوّره render.mjs).
  بدون معامل: يعرض الأربعة مصغّرة.
  كل مشهد يركّب لوحة من png/ فوق جسر.
-->
<style>
  html, body { margin: 0; background: #111; }
  body.gallery { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px; padding: 16px; }
  body.gallery canvas { width: 100%; height: auto; border-radius: 8px; }
  body.single canvas { display: block; }
</style>
</head>
<body>
<script>
const W = 1080, H = 1920;

// كل مشهد: اللوحة، الوقت، ونوع الإطار
const SCENES = [
  { board: 'png/board-01-carousel-1.png', time: 'sunset', frame: 'car', seed: 11 },
  { board: 'png/board-02-carousel-2.png', time: 'night', frame: 'car', seed: 23 },
  { board: 'png/board-03-carousel-3.png', time: 'dusk', frame: 'tunnel', seed: 37 },
  { board: 'png/board-04-carousel-4.png', time: 'blue', frame: 'car', seed: 53 },
];

const SKIES = {
  sunset: { stops: [[0, '#3b3560'], [.16, '#8a5a7a'], [.32, '#df8668'], [.46, '#f6b06a'], [.66, '#ffd9a0']], sun: [905, 520, '#fff1cf'], haze: 'rgba(255,170,110,.35)', city: '#3a2a35', lit: .15, road: ['#5a4a4c', '#2a2226'], ambient: 1 },
  night:  { stops: [[0, '#05060c'], [.40, '#0d1226'], [.58, '#1d1f38'], [.66, '#3a2f3c']], sun: null, haze: 'rgba(255,150,80,.18)', city: '#0b0c16', lit: .75, road: ['#1d1c22', '#0b0b0f'], ambient: .35 },
  dusk:   { stops: [[0, '#1b1838'], [.35, '#4a3463'], [.52, '#b0607a'], [.62, '#f08a5e'], [.67, '#ffbf80']], sun: [900, 930, '#ffc58a'], haze: 'rgba(240,140,100,.3)', city: '#2a1e2e', lit: .35, road: ['#3c3238', '#17121a'], ambient: .8 },
  blue:   { stops: [[0, '#0d1838'], [.38, '#1f3466'], [.56, '#46619a'], [.63, '#c58a7a'], [.67, '#f2b07c']], sun: null, haze: 'rgba(240,160,120,.22)', city: '#141b30', lit: .55, road: ['#2a2d3a', '#111219'], ambient: .6 },
};

const HORIZON = 1010, VX = 540;

function rng(seed) { let s = seed >>> 0; return () => ((s = (s * 1664525 + 1013904223) >>> 0) / 4294967296); }
function loadImg(src) { return new Promise((ok, no) => { const i = new Image(); i.onload = () => ok(i); i.onerror = no; i.src = src; }); }

function sky(ctx, S) {
  const g = ctx.createLinearGradient(0, 0, 0, HORIZON + 40);
  S.stops.forEach(([o, c]) => g.addColorStop(o / .67, c));
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, HORIZON + 40);
  if (S.sun) {
    const [x, y, c] = S.sun;
    const r = ctx.createRadialGradient(x, y, 0, x, y, 520);
    r.addColorStop(0, c); r.addColorStop(.08, 'rgba(255,220,170,.9)'); r.addColorStop(.3, 'rgba(255,170,110,.35)'); r.addColorStop(1, 'rgba(255,150,100,0)');
    ctx.fillStyle = r; ctx.fillRect(0, 0, W, HORIZON + 40);
  }
}

function stars(ctx, R, S) {
  if (S.lit < .5) return;
  for (let i = 0; i < 90; i++) {
    ctx.fillStyle = `rgba(255,255,255,${.15 + R() * .4})`;
    ctx.fillRect(R() * W, R() * 520, 1.6, 1.6);
  }
}

function skyline(ctx, R, S) {
  // طبقتان من الأبراج: بعيدة باهتة، وقريبة أغمق، مع نوافذ مضاءة
  for (const layer of [{ base: HORIZON, maxH: 420, alpha: .5, w: [30, 70] }, { base: HORIZON + 6, maxH: 640, alpha: 1, w: [40, 110] }]) {
    let x = -20;
    while (x < W + 20) {
      const w = layer.w[0] + R() * (layer.w[1] - layer.w[0]);
      const h = 40 + Math.pow(R(), 3) * layer.maxH;
      ctx.globalAlpha = layer.alpha; ctx.fillStyle = S.city;
      const top = layer.base - h;
      ctx.fillRect(x, top, w, h);
      // برج نحيف بقمة مدببة أحياناً
      if (R() < .15 && layer.alpha === 1) {
        ctx.beginPath(); ctx.moveTo(x + w * .3, top); ctx.lineTo(x + w * .5, top - 60 - R() * 60); ctx.lineTo(x + w * .7, top); ctx.fill();
      }
      if (S.lit > .2) {
        for (let wy = top + 8; wy < layer.base - 6; wy += 9) for (let wx = x + 5; wx < x + w - 5; wx += 8) {
          if (R() < S.lit * .35) { ctx.fillStyle = R() < .7 ? 'rgba(255,214,150,.75)' : 'rgba(210,230,255,.6)'; ctx.fillRect(wx, wy, 3, 4); }
        }
        ctx.fillStyle = S.city;
      }
      x += w + R() * 14;
    }
  }
  ctx.globalAlpha = 1;
  const h = ctx.createLinearGradient(0, HORIZON - 160, 0, HORIZON + 30);
  h.addColorStop(0, 'rgba(0,0,0,0)'); h.addColorStop(1, S.haze);
  ctx.fillStyle = h; ctx.fillRect(0, HORIZON - 160, W, 190);
}

function road(ctx, R, S) {
  const g = ctx.createLinearGradient(0, HORIZON, 0, H);
  g.addColorStop(0, S.road[0]); g.addColorStop(1, S.road[1]);
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.moveTo(VX - 40, HORIZON); ctx.lineTo(VX + 40, HORIZON); ctx.lineTo(W + 900, H); ctx.lineTo(-900, H); ctx.fill();
  // أرض جانبية
  ctx.fillStyle = S.city; ctx.globalAlpha = .9;
  ctx.beginPath(); ctx.moveTo(0, HORIZON); ctx.lineTo(VX - 40, HORIZON); ctx.lineTo(-900, H); ctx.lineTo(0, H); ctx.fill();
  ctx.beginPath(); ctx.moveTo(W, HORIZON); ctx.lineTo(VX + 40, HORIZON); ctx.lineTo(W + 900, H); ctx.lineTo(W, H); ctx.fill();
  ctx.globalAlpha = 1;
  // خطوط المسارات المتقطعة
  for (const lane of [-.62, -.22, .22, .62]) {
    for (let t = 0; t < 1; t += .045) {
      const t2 = t + .022; const p = (u) => Math.pow(u, 2.1);
      const y1 = HORIZON + (H - HORIZON) * p(t), y2 = HORIZON + (H - HORIZON) * p(t2);
      const x1 = VX + lane * 1600 * p(t), x2 = VX + lane * 1600 * p(t2);
      ctx.strokeStyle = `rgba(255,240,215,${.25 + .5 * S.ambient})`; ctx.lineWidth = 1 + 10 * p(t);
      ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
    }
  }
}

function palm(ctx, x, base, h, color) {
  ctx.strokeStyle = color; ctx.fillStyle = color; ctx.lineWidth = Math.max(1.5, h * .045);
  ctx.beginPath(); ctx.moveTo(x, base); ctx.quadraticCurveTo(x + h * .06, base - h * .5, x + h * .02, base - h); ctx.stroke();
  const tx = x + h * .02, ty = base - h;
  for (let i = 0; i < 9; i++) {
    const a = -Math.PI / 2 + (i - 4) * .42; const L = h * (.38 + (i % 2) * .08);
    ctx.lineWidth = Math.max(1, h * .03);
    ctx.beginPath(); ctx.moveTo(tx, ty);
    ctx.quadraticCurveTo(tx + Math.cos(a) * L * .6, ty + Math.sin(a) * L * .6 - h * .05, tx + Math.cos(a) * L, ty + Math.sin(a) * L + h * .18);
    ctx.stroke();
  }
}

function roadside(ctx, R, S) {
  // نخيل وأعمدة إنارة على الجانبين تقترب من المشاهد
  for (let i = 0; i < 9; i++) {
    const t = Math.pow(i / 9, 1.6) * .55 + .02;
    const y = HORIZON + (H - HORIZON) * t * t * 1.4;
    const sc = .08 + t * 2.4;
    for (const side of [-1, 1]) {
      const x = VX + side * (130 + 1500 * t * t);
      if (i % 2 === 0) palm(ctx, x + side * 30 * sc, y, 260 * sc, S.city);
      // عمود إنارة
      ctx.strokeStyle = S.city; ctx.lineWidth = Math.max(1, 6 * sc);
      ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x, y - 380 * sc); ctx.lineTo(x - side * 70 * sc, y - 395 * sc); ctx.stroke();
      if (S.ambient < .9 || true) {
        const lx = x - side * 70 * sc, ly = y - 392 * sc;
        const r = ctx.createRadialGradient(lx, ly, 0, lx, ly, 60 * sc + 8);
        r.addColorStop(0, `rgba(255,205,140,${.9 - S.ambient * .5})`); r.addColorStop(1, 'rgba(255,180,100,0)');
        ctx.fillStyle = r; ctx.beginPath(); ctx.arc(lx, ly, 60 * sc + 8, 0, Math.PI * 2); ctx.fill();
      }
    }
  }
}

function overpass(ctx, S, img) {
  const top = 840, deck = 58;
  // اللوحة: حاملان معدنيان فوق الجسر
  const bw = 860, bh = bw / 4, bx = (W - bw) / 2, by = top - bh - 70;
  ctx.fillStyle = '#26232a';
  for (const px of [bx + bw * .22, bx + bw * .78]) ctx.fillRect(px - 9, by + bh - 4, 18, top - (by + bh) + 4);
  ctx.fillRect(bx + bw * .18, by + bh + 26, bw * .64, 8);
  // ظل خلف اللوحة وإطار معدني
  ctx.save();
  ctx.shadowColor = 'rgba(0,0,0,.45)'; ctx.shadowBlur = 30; ctx.shadowOffsetY = 10;
  ctx.fillStyle = '#2e2b30'; ctx.fillRect(bx - 12, by - 12, bw + 24, bh + 24);
  ctx.restore();
  ctx.drawImage(img, bx, by, bw, bh);
  // إضاءة اللوحة: أغمق قليلاً في الغروب، متوهجة في الليل
  const lightLevel = S.ambient;
  if (lightLevel < .9) {
    ctx.fillStyle = `rgba(20,14,30,${(1 - lightLevel) * .18})`; ctx.fillRect(bx, by, bw, bh);
    const glow = ctx.createRadialGradient(W / 2, by + bh / 2, bw * .2, W / 2, by + bh / 2, bw * .75);
    glow.addColorStop(0, `rgba(255,236,205,${(1 - lightLevel) * .22})`); glow.addColorStop(1, 'rgba(255,230,200,0)');
    ctx.globalCompositeOperation = 'screen'; ctx.fillStyle = glow; ctx.fillRect(0, 0, W, H); ctx.globalCompositeOperation = 'source-over';
    // كشافات صغيرة فوق اللوحة
    for (let i = 0; i < 4; i++) {
      const lx = bx + bw * (.14 + i * .24);
      ctx.fillStyle = '#1c1a1f'; ctx.fillRect(lx - 10, by - 34, 20, 10); ctx.fillRect(lx - 2, by - 26, 4, 20);
      const c = ctx.createLinearGradient(0, by - 26, 0, by + bh * .6);
      c.addColorStop(0, `rgba(255,240,210,${(1 - lightLevel) * .35})`); c.addColorStop(1, 'rgba(255,240,210,0)');
      ctx.fillStyle = c; ctx.beginPath(); ctx.moveTo(lx - 6, by - 24); ctx.lineTo(lx + 6, by - 24); ctx.lineTo(lx + 90, by + bh * .6); ctx.lineTo(lx - 90, by + bh * .6); ctx.fill();
    }
  } else {
    // ضوء الشمس الدافئ على وجه اللوحة
    const warm = ctx.createLinearGradient(bx + bw, by, bx, by + bh);
    warm.addColorStop(0, 'rgba(255,190,120,.16)'); warm.addColorStop(1, 'rgba(80,40,60,.12)');
    ctx.fillStyle = warm; ctx.fillRect(bx, by, bw, bh);
  }
  // الجسر: سطح خرساني، حاجز، أعمدة
  const g = ctx.createLinearGradient(0, top, 0, top + deck);
  g.addColorStop(0, S.ambient > .7 ? '#7d6a66' : '#3a3740'); g.addColorStop(1, S.ambient > .7 ? '#3d3036' : '#18171c');
  ctx.fillStyle = '#2b2830'; ctx.fillRect(0, top - 26, W, 26);
  for (let x = 0; x < W; x += 24) { ctx.fillStyle = 'rgba(0,0,0,.25)'; ctx.fillRect(x, top - 26, 3, 26); }
  ctx.fillStyle = g; ctx.fillRect(0, top, W, deck);
  ctx.fillStyle = 'rgba(0,0,0,.55)'; ctx.fillRect(0, top + deck, W, 14);
  ctx.fillStyle = S.ambient > .7 ? '#2e252b' : '#121116';
  for (const px of [150, 930]) ctx.fillRect(px - 28, top + deck, 56, HORIZON - top - deck + 20);
  ctx.fillRect(VX - 22, top + deck, 44, HORIZON - top - deck + 6);
  // أضواء صغيرة تحت الجسر
  for (let x = 40; x < W; x += 110) {
    const r = ctx.createRadialGradient(x, top + deck + 8, 0, x, top + deck + 8, 26);
    r.addColorStop(0, 'rgba(255,200,130,.8)'); r.addColorStop(1, 'rgba(255,200,130,0)');
    ctx.fillStyle = r; ctx.fillRect(x - 26, top + deck - 18, 52, 52);
  }
}

function traffic(ctx, R, S) {
  // سيارات أمامنا في مساراتنا: هيكل داكن وضوءان خلفيان أحمران
  const cars = [];
  for (let i = 0; i < 9; i++) cars.push({ t: .05 + R() * .32, lane: [-.42, 0, .42][Math.floor(R() * 3)] + (R() - .5) * .08 });
  cars.sort((a, b) => a.t - b.t);
  const p = (u) => Math.pow(u, 2.1);
  for (const c of cars) {
    const k = p(c.t), y = HORIZON + (H - HORIZON) * k, x = VX + c.lane * 1600 * k;
    const w = Math.max(10, 430 * k), h = w * .55;
    // ظل على الأرض
    ctx.fillStyle = 'rgba(0,0,0,.35)'; ctx.beginPath(); ctx.ellipse(x, y, w * .62, h * .12, 0, 0, Math.PI * 2); ctx.fill();
    // الهيكل
    const body = ctx.createLinearGradient(0, y - h, 0, y);
    body.addColorStop(0, S.ambient > .7 ? '#3b3038' : '#141318'); body.addColorStop(1, '#0b0a0d');
    ctx.fillStyle = body;
    ctx.beginPath(); ctx.roundRect(x - w / 2, y - h * .62, w, h * .55, h * .12); ctx.fill();
    ctx.beginPath(); ctx.roundRect(x - w * .36, y - h, w * .72, h * .45, h * .15); ctx.fill();
    // الزجاج الخلفي يعكس السماء
    ctx.fillStyle = S.ambient > .7 ? 'rgba(240,160,120,.25)' : 'rgba(120,130,170,.18)';
    ctx.beginPath(); ctx.roundRect(x - w * .3, y - h * .95, w * .6, h * .3, h * .1); ctx.fill();
    // الأضواء الخلفية
    for (const side of [-1, 1]) {
      const lx = x + side * w * .38, ly = y - h * .45, s = Math.max(3, w * .08);
      ctx.fillStyle = '#ff2a2a'; ctx.beginPath(); ctx.roundRect(lx - s, ly - s * .45, s * 2, s * .9, s * .3); ctx.fill();
      const g = ctx.createRadialGradient(lx, ly, 0, lx, ly, s * 5);
      g.addColorStop(0, 'rgba(255,50,40,.55)'); g.addColorStop(1, 'rgba(255,40,40,0)');
      ctx.fillStyle = g; ctx.fillRect(lx - s * 5, ly - s * 5, s * 10, s * 10);
    }
    // انعكاس الأضواء على الأسفلت
    const rg = ctx.createLinearGradient(0, y, 0, y + h * 1.4);
    rg.addColorStop(0, `rgba(255,40,40,${.25 + (1 - S.ambient) * .3})`); rg.addColorStop(1, 'rgba(255,40,40,0)');
    ctx.fillStyle = rg; ctx.fillRect(x - w * .45, y, w * .9, h * 1.4);
  }
}

function tunnelFrame(ctx, S) {
  // نحن داخل النفق: الفتحة أمامنا، والأسفلت يكمل لين السيارة
  const L = 70, Rt = W - 70, T = 360;
  const opening = () => {
    ctx.moveTo(L, T + 110); ctx.quadraticCurveTo(L, T, L + 110, T); ctx.lineTo(Rt - 110, T); ctx.quadraticCurveTo(Rt, T, Rt, T + 110);
    ctx.lineTo(Rt, HORIZON); ctx.lineTo(W + 520, H); ctx.lineTo(-520, H); ctx.lineTo(L, HORIZON); ctx.closePath();
  };
  ctx.save();
  // أرضية النفق أغمق من الخارج
  const floor = ctx.createLinearGradient(0, HORIZON, 0, H);
  floor.addColorStop(0, 'rgba(10,6,8,.15)'); floor.addColorStop(.25, 'rgba(10,6,8,.6)'); floor.addColorStop(1, 'rgba(6,4,6,.85)');
  ctx.fillStyle = floor; ctx.beginPath(); ctx.moveTo(L, HORIZON); ctx.lineTo(Rt, HORIZON); ctx.lineTo(W + 520, H); ctx.lineTo(-520, H); ctx.fill();
  // الجدران والسقف
  ctx.fillStyle = '#100c0f';
  ctx.beginPath(); ctx.rect(0, 0, W, H); opening(); ctx.fill('evenodd');
  const wallL = ctx.createLinearGradient(0, 0, L + 40, 0);
  wallL.addColorStop(0, 'rgba(70,40,25,.0)'); wallL.addColorStop(1, 'rgba(150,90,50,.35)');
  ctx.fillStyle = wallL; ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(L, T + 60); ctx.lineTo(L, HORIZON); ctx.lineTo(-520, H); ctx.lineTo(0, H); ctx.fill();
  const wallR = ctx.createLinearGradient(W, 0, Rt - 40, 0);
  wallR.addColorStop(0, 'rgba(70,40,25,.0)'); wallR.addColorStop(1, 'rgba(150,90,50,.35)');
  ctx.fillStyle = wallR; ctx.beginPath(); ctx.moveTo(W, 0); ctx.lineTo(Rt, T + 60); ctx.lineTo(Rt, HORIZON); ctx.lineTo(W + 520, H); ctx.lineTo(W, H); ctx.fill();
  // صفّا أضواء برتقالية في السقف يتقاربان نحو الفتحة
  for (const side of [-1, 1]) {
    for (let i = 0; i < 8; i++) {
      const u = Math.pow(i / 8, 1.5);
      const x = VX + side * (380 + 300 * (1 - u)) * (1 - u * .0) * (1 + (1 - u) * .35);
      const y = T - 30 - (1 - u) * 330;
      const s = 6 + 34 * (1 - u);
      ctx.fillStyle = 'rgba(255,215,150,.95)'; ctx.beginPath(); ctx.roundRect(x - s, y - s * .25, s * 2, s * .5, s * .2); ctx.fill();
      const r = ctx.createRadialGradient(x, y, 0, x, y, s * 3);
      r.addColorStop(0, 'rgba(255,170,80,.6)'); r.addColorStop(1, 'rgba(255,140,60,0)');
      ctx.fillStyle = r; ctx.fillRect(x - s * 3, y - s * 3, s * 6, s * 6);
    }
  }
  // حافة الفتحة مضاءة من الخارج
  ctx.strokeStyle = 'rgba(255,190,140,.4)'; ctx.lineWidth = 5;
  ctx.beginPath(); ctx.moveTo(L, HORIZON); ctx.lineTo(L, T + 110); ctx.quadraticCurveTo(L, T, L + 110, T); ctx.lineTo(Rt - 110, T); ctx.quadraticCurveTo(Rt, T, Rt, T + 110); ctx.lineTo(Rt, HORIZON); ctx.stroke();
  // ضوء الخارج ينسكب على أرضية النفق
  const spill = ctx.createRadialGradient(VX, HORIZON, 20, VX, HORIZON, 700);
  spill.addColorStop(0, 'rgba(255,170,120,.28)'); spill.addColorStop(1, 'rgba(255,170,120,0)');
  ctx.fillStyle = spill; ctx.fillRect(0, HORIZON, W, 700);
  ctx.restore();
}

function carFrame(ctx, S, R) {
  // طبلون، عمودا الزجاج، ومرآة. كلها خارج نطاق اللوحة
  ctx.save();
  const dash = ctx.createLinearGradient(0, 1560, 0, H);
  dash.addColorStop(0, '#16141a'); dash.addColorStop(1, '#050407');
  ctx.fillStyle = dash;
  ctx.beginPath(); ctx.moveTo(0, 1600); ctx.bezierCurveTo(300, 1540, 780, 1540, W, 1590); ctx.lineTo(W, H); ctx.lineTo(0, H); ctx.fill();
  // انعكاس الطبلون على الزجاج
  ctx.globalAlpha = .07; ctx.fillStyle = '#d8cfc4';
  ctx.beginPath(); ctx.moveTo(0, 1480); ctx.bezierCurveTo(300, 1420, 780, 1420, W, 1470); ctx.lineTo(W, 1540); ctx.bezierCurveTo(780, 1500, 300, 1500, 0, 1560); ctx.fill();
  ctx.globalAlpha = 1;
  // حافة الطبلون اللامعة
  ctx.strokeStyle = `rgba(255,220,180,${.08 + .12 * S.ambient})`; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(0, 1600); ctx.bezierCurveTo(300, 1540, 780, 1540, W, 1590); ctx.stroke();
  // أعمدة الزجاج
  ctx.fillStyle = '#09080b';
  ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(120, 0); ctx.lineTo(40, 1620); ctx.lineTo(0, 1640); ctx.fill();
  ctx.beginPath(); ctx.moveTo(W, 0); ctx.lineTo(W - 120, 0); ctx.lineTo(W - 40, 1620); ctx.lineTo(W, 1640); ctx.fill();
  // سقف السيارة
  const roof = ctx.createLinearGradient(0, 0, 0, 170);
  roof.addColorStop(0, '#08070a'); roof.addColorStop(1, 'rgba(8,7,10,0)');
  ctx.fillStyle = roof; ctx.fillRect(0, 0, W, 170);
  ctx.fillStyle = '#0a090c';
  ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(W, 0); ctx.lineTo(W, 70); ctx.bezierCurveTo(700, 110, 380, 110, 0, 70); ctx.fill();
  // المرآة الداخلية: يمين الوسط، فوق اللوحة
  ctx.fillStyle = '#0c0b0e'; ctx.fillRect(700, 90, 10, 60);
  ctx.beginPath(); ctx.roundRect(600, 140, 230, 70, 22); ctx.fill();
  ctx.fillStyle = 'rgba(255,200,150,.08)'; ctx.beginPath(); ctx.roundRect(612, 150, 206, 50, 16); ctx.fill();
  ctx.restore();
}

function windshield(ctx, S, R) {
  // لمعان خفيف على الزجاج + ذرات غبار
  const g = ctx.createLinearGradient(0, 200, W, 1400);
  g.addColorStop(0, 'rgba(255,255,255,0)'); g.addColorStop(.48, 'rgba(255,255,255,0)'); g.addColorStop(.5, `rgba(255,240,220,${.03 + .03 * S.ambient})`); g.addColorStop(.56, 'rgba(255,255,255,0)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  for (let i = 0; i < 70; i++) {
    ctx.fillStyle = `rgba(255,240,220,${.03 + R() * .06})`;
    ctx.beginPath(); ctx.arc(R() * W, 150 + R() * 1400, .8 + R() * 2.2, 0, Math.PI * 2); ctx.fill();
  }
}

function finish(ctx, R, S) {
  // تدرّج لوني سينمائي، تظليل الأطراف، وحبيبات
  const v = ctx.createRadialGradient(W / 2, H * .45, W * .35, W / 2, H * .5, H * .75);
  v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(0,0,0,.55)');
  ctx.fillStyle = v; ctx.fillRect(0, 0, W, H);
  const img = ctx.getImageData(0, 0, W, H), d = img.data;
  for (let i = 0; i < d.length; i += 4) {
    const n = (R() - .5) * 16;
    d[i] += n; d[i + 1] += n; d[i + 2] += n;
  }
  ctx.putImageData(img, 0, 0);
}

async function drawScene(canvas, cfg) {
  const ctx = canvas.getContext('2d');
  const S = SKIES[cfg.time], R = rng(cfg.seed);
  const board = await loadImg(cfg.board);
  sky(ctx, S); stars(ctx, R, S); skyline(ctx, R, S);
  road(ctx, R, S); roadside(ctx, R, S);
  // عمق: البعيد أنعم قليلاً
  ctx.filter = 'blur(1.2px)'; ctx.drawImage(canvas, 0, 0); ctx.filter = 'none';
  traffic(ctx, R, S);
  overpass(ctx, S, board);
  if (cfg.frame === 'tunnel') tunnelFrame(ctx, S);
  windshield(ctx, S, R);
  if (cfg.frame === 'car') carFrame(ctx, S, R);
  else {
    // داخل النفق نشوف الطبلون فقط
    const dash = ctx.createLinearGradient(0, 1600, 0, H); dash.addColorStop(0, '#120f13'); dash.addColorStop(1, '#040305');
    ctx.fillStyle = dash; ctx.beginPath(); ctx.moveTo(0, 1640); ctx.bezierCurveTo(300, 1580, 780, 1580, W, 1630); ctx.lineTo(W, H); ctx.lineTo(0, H); ctx.fill();
  }
  finish(ctx, R, S);
}

const n = Number(new URLSearchParams(location.search).get('scene'));
(async () => {
  const list = n >= 1 && n <= SCENES.length ? [SCENES[n - 1]] : SCENES;
  document.body.className = list.length === 1 ? 'single' : 'gallery';
  for (const cfg of list) {
    const c = document.createElement('canvas'); c.width = W; c.height = H;
    document.body.appendChild(c);
    await drawScene(c, cfg);
  }
  window.__ready = true;
})();
</script>
