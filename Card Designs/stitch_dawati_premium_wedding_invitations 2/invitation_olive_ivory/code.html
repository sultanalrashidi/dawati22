<body class="antialiased min-h-screen flex items-center justify-center p-4">

<main class="relative w-full max-w-[400px] h-[800px] bg-background shadow-2xl overflow-hidden flex flex-col justify-between p-8">

<!-- Top Section: Header & Date -->
<div class="mt-8 flex flex-col items-center gap-y-6 w-full">
<span class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-[0.2em]">Together with their families</span>
<div class="flex flex-col items-center gap-y-2 mt-4">
<h1 class="font-display-lg-mobile text-display-lg-mobile text-on-surface">Elias</h1>

<h1 class="font-display-lg-mobile text-display-lg-mobile text-on-surface">Amara</h1>
</div>
<div class="h-px w-16 bg-primary/20 my-4"></div>
<div class="flex flex-col gap-y-1">
<p class="font-body-lg text-body-lg text-on-surface-variant">Request the pleasure of your company</p>
<p class="font-body-md text-body-md text-on-surface-variant">to celebrate their marriage</p>
</div>
</div>
<!-- Middle Section: Details -->
<div class="flex flex-col items-center justify-center flex-grow w-full gap-y-8">
<div class="flex flex-col items-center">
<span class="font-label-sm text-label-sm text-primary uppercase tracking-[0.15em] mb-2">When</span>
<p class="font-headline-md text-headline-md text-on-surface">Saturday</p>
<p class="font-body-lg text-body-lg text-on-surface-variant">October 14th, 2024</p>
<p class="font-body-md text-body-md text-on-surface-variant mt-1">4:00 PM</p>
</div>
<div class="flex flex-col items-center">
<span class="font-label-sm text-label-sm text-primary uppercase tracking-[0.15em] mb-2">Where</span>
<p class="font-headline-md text-headline-md text-on-surface">The Conservatory</p>
<p class="font-body-md text-body-md text-on-surface-variant">123 Botanical Lane</p>
<p class="font-body-md text-body-md text-on-surface-variant">City, State 12345</p>
</div>
</div>
<!-- Bottom Section: QR & Action -->
<div class="mb-8 flex flex-col items-center gap-y-6 w-full">
<div class="flex flex-col items-center gap-y-3">
<span class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-widest">RSVP</span>
<!-- Elegant QR Code Container -->
<div class="p-2 border border-primary/20 rounded-lg bg-surface">
