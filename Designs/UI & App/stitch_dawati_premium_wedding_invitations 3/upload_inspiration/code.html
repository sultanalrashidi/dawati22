<!DOCTYPE html>

<style>
        .halo-shadow {
            box-shadow: 0 10px 40px -10px rgba(229, 211, 179, 0.5); /* Primary Champagne halo */
        }
        input:focus, textarea:focus {
            outline: none;
            box-shadow: none;
        }
    </style>
</head>
<body class="bg-background text-on-background min-h-screen flex flex-col">
<!-- TopAppBar -->
<header class="fixed top-0 w-full z-50 bg-surface/80 dark:bg-surface/80 backdrop-blur-xl transition-all duration-300">
<div class="flex items-center justify-between px-margin-mobile w-full h-16 max-w-7xl mx-auto">
<button aria-label="Back" class="text-primary hover:opacity-80 transition-opacity active:scale-95 transition-transform duration-200 w-10 h-10 flex items-center justify-center rounded-full">
<span class="material-symbols-outlined" data-icon="arrow_forward">arrow_forward</span>
</button>
<h1 class="font-display-lg-mobile text-display-lg-mobile text-primary tracking-tight">Dawati</h1>
<button aria-label="More options" class="text-primary hover:opacity-80 transition-opacity active:scale-95 transition-transform duration-200 w-10 h-10 flex items-center justify-center rounded-full">
<span class="material-symbols-outlined" data-icon="more_vert">more_vert</span>
</button>
</div>
</header>
<main class="flex-grow pt-[104px] pb-32 px-margin-mobile md:px-margin-desktop max-w-7xl mx-auto w-full">
<!-- Header Section -->
<div class="mb-lg max-w-2xl">
<p class="font-label-sm text-label-sm text-primary mb-xs uppercase tracking-widest">الخطوة 2 من 3</p>
<h2 class="font-display-lg-mobile text-display-lg-mobile md:font-display-lg md:text-display-lg text-on-surface mb-sm">رفع الإلهام</h2>
<p class="font-body-md text-body-md text-on-surface-variant">شاركنا صوراً، رسومات، أو أفكار تعكس رؤيتك للتصميم. هذا سيساعدنا في إنشاء دعوة زفاف مثالية لك.</p>
</div>
<!-- Upload Area -->
<div class="border border-dashed border-outline-variant rounded-xl bg-surface-container-low flex flex-col items-center justify-center p-lg mb-lg cursor-pointer hover:bg-surface-container transition-colors group relative overflow-hidden">
<div class="w-16 h-16 rounded-full bg-primary-container flex items-center justify-center mb-sm group-hover:scale-105 transition-transform">
<span class="material-symbols-outlined text-on-primary-container" data-icon="cloud_upload" style="font-variation-settings: 'FILL' 1;">cloud_upload</span>
</div>
<p class="font-headline-md text-headline-md-mobile text-on-surface mb-xs">اضغط هنا لرفع الملفات</p>
<p class="font-body-md text-body-md text-on-surface-variant text-center">أو قم بسحب وإفلات الصور هنا<br/><span class="text-sm opacity-70">JPEG, PNG, PDF (الحد الأقصى 10MB)</span></p>
<input accept="image/*,.pdf" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer" multiple="" type="file"/>
</div>
<!-- Uploaded Thumbnails Grid (Bento style) -->
<div class="grid grid-cols-2 md:grid-cols-4 gap-sm mb-lg">
<!-- Thumbnail 1 -->
<div class="relative rounded-lg overflow-hidden group aspect-square">
<img class="w-full h-full object-cover" data-alt="A delicate botanical illustration of a white rose with subtle green leaves, styled as a high-end editorial wedding stationery element, soft natural lighting, creamy off-white background, elegant modern luxury aesthetic." src="https://lh3.googleusercontent.com/aida-public/AB6AXuBf2bYHMAYj0y7WfJHsGF5gRZNy_5fNSjaCnDsYwnzzyff6xE9qY5er2e9RRmwE3DKkNY__PUeESmQWcnNA-Pi-Y7rL9Wpcvvj5nYSRTtCUu9GVEeaZu2XQADOBJvQPf_PAQ_SejHFsUxr3N4bbB-iQJCrtyfSH4XdkSSNhtgfehiOBMxKJ-pym3hkkBPbu68HlZ7ab03vrlsmSGZ7DGsxAT2g9luPc2EyxoyvDw-YfWN3n26UGohjT"/>
<div class="absolute inset-0 bg-black/20 opacity-0 group-hover:opacity-100 transition-opacity flex items-start justify-end p-xs">
<button class="w-8 h-8 rounded-full bg-surface-container-lowest/90 backdrop-blur-sm flex items-center justify-center text-error hover:bg-error-container hover:text-on-error-container transition-colors shadow-sm">
<span class="material-symbols-outlined text-sm" data-icon="close">close</span>
</button>
</div>
</div>
<!-- Thumbnail 2 -->
<div class="relative rounded-lg overflow-hidden group aspect-square">
<img class="w-full h-full object-cover" data-alt="A luxurious mood board composition featuring swatches of champagne silk fabric, delicate gold foil typography samples, and a sprig of dried eucalyptus, photographed overhead on a minimalist slate surface, warm elegant lighting." src="https://lh3.googleusercontent.com/aida-public/AB6AXuAt8RfCn-YGK43Z3nx9PTMqffIW2nYM6z8_y5t_PPsGDD8_Oesud3UIN1b0oN0dnPqI0rgCb2-5esRTwlOEbrBZR-G7_uzln892JHonVNoUqlIU6LMMLOC8pGBlcW0WYvtoUTDRO1hmxLMOKj6IwKxJjvedJcMB1FE9Ex5UoaX_oqM9cWM-UVWevwftncuIdA6FEgH48wiRN9LCkX1Bo2Le-GrV4E-irx-uogAzaDW2v_R4VoKodgIg"/>
<div class="absolute inset-0 bg-black/20 opacity-0 group-hover:opacity-100 transition-opacity flex items-start justify-end p-xs">
<button class="w-8 h-8 rounded-full bg-surface-container-lowest/90 backdrop-blur-sm flex items-center justify-center text-error hover:bg-error-container hover:text-on-error-container transition-colors shadow-sm">
<span class="material-symbols-outlined text-sm" data-icon="close">close</span>
</button>
</div>
</div>
<!-- Thumbnail 3 -->
<div class="relative rounded-lg overflow-hidden group aspect-square">
<img class="w-full h-full object-cover" data-alt="Close up of elegant Arabic calligraphy written in deep charcoal ink on textured cotton paper, showcasing fluid artistic strokes, soft dramatic side lighting, premium editorial style, high contrast minimalist composition." src="https://lh3.googleusercontent.com/aida-public/AB6AXuAl9YRNlc_oQcdS0mmSgRfqStiHEE40Tv7TQEN0rHjeXVgRv2I30d98vANLrkoKDuozjrR4nZuO7gtD8VLhEphM2li_X9En-y9TmrDQZfLrwQ22Q7bMcwVcWtgsjbcxfMHjRLP7kRR0pskqmgtmKhSEzQWiGdSeInM_TePTLvtfWPrmP9gpDW9rGin53uk5lJHdielonfkSF8PiPfrJGX6lY4ZA5xz3DwVAEwoiNfsTV_UyoZrTF4M1"/>
<div class="absolute inset-0 bg-black/20 opacity-0 group-hover:opacity-100 transition-opacity flex items-start justify-end p-xs">
<button class="w-8 h-8 rounded-full bg-surface-container-lowest/90 backdrop-blur-sm flex items-center justify-center text-error hover:bg-error-container hover:text-on-error-container transition-colors shadow-sm">
<span class="material-symbols-outlined text-sm" data-icon="close">close</span>
</button>
</div>
</div>
<!-- Empty slot for bento effect -->
<div class="hidden md:flex border border-dashed border-outline-variant/50 rounded-lg items-center justify-center aspect-square bg-surface-container-lowest/50 text-outline-variant">
<span class="material-symbols-outlined opacity-50" data-icon="add_photo_alternate">add_photo_alternate</span>
</div>
</div>
<!-- Additional Notes -->
<div class="mb-xl">
<label class="block font-label-sm text-label-sm text-on-surface mb-xs uppercase tracking-wider" for="notes">ملاحظات إضافية للمصمم</label>
<div class="relative">
<textarea class="w-full bg-transparent border-0 border-b border-outline-variant text-on-surface font-body-md text-body-md focus:border-b-2 focus:border-primary transition-colors resize-none px-0 py-sm" id="notes" placeholder="أخبرنا عن الألوان المفضلة، أو أي تفاصيل خاصة تريد تضمينها..." rows="4"></textarea>
</div>
</div>
<!-- Floating Action Area (Continue) -->
<div class="fixed bottom-0 left-0 w-full bg-gradient-to-t from-surface to-transparent pb-margin-mobile pt-lg px-margin-mobile md:px-margin-desktop z-40 flex justify-end">
<div class="max-w-7xl mx-auto w-full flex justify-end">
<button class="bg-primary-container text-on-primary-container font-body-md text-body-md px-xl py-sm rounded-full halo-shadow hover:opacity-90 active:scale-[0.98] transition-all duration-200 flex items-center gap-2">
                    المتابعة
                    <span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
</div>
</div>
</main>
<!-- Suppressed Bottom Navigation for Linear Flow -->
</body></html>
