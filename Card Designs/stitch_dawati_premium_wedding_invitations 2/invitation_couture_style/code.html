<style>
        .silk-texture {
            background-color: #fcf9f8;
            background-image: 
                radial-gradient(ellipse at center, rgba(229, 211, 179, 0.15) 0%, rgba(252, 249, 248, 0) 70%),
                linear-gradient(135deg, rgba(212, 165, 165, 0.05) 0%, rgba(229, 211, 179, 0.1) 50%, rgba(252, 249, 248, 0) 100%);
            background-size: 150% 150%;
            animation: silk-shimmer 15s ease-in-out infinite alternate;
        }

        @keyframes silk-shimmer {
            0% { background-position: 0% 0%; }
            100% { background-position: 100% 100%; }
        }

        .floating-text {
            animation: float 6s ease-in-out infinite;
        }

        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }
        
        .fade-in-up {
            opacity: 0;
            transform: translateY(20px);
            animation: fadeInUp 1s ease-out forwards;
        }

        @keyframes fadeInUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .delay-1 { animation-delay: 0.3s; }
        .delay-2 { animation-delay: 0.6s; }
        .delay-3 { animation-delay: 0.9s; }
    </style>

<body class="bg-surface flex items-center justify-center min-h-screen p-margin-mobile">
<!-- Mobile Container (9:16 aspect ratio constraint) -->
<main class="relative w-full max-w-[400px] aspect-[9/16] bg-surface rounded-[2rem] overflow-hidden shadow-[0_20px_40px_-15px_rgba(229,211,179,0.3)] border border-primary-container/30 silk-texture flex flex-col items-center justify-between p-lg text-center">
<!-- Top Decor -->
<div class="w-full flex justify-center pt-md fade-in-up">
<span class="material-symbols-outlined text-primary text-3xl font-light opacity-50" style="font-variation-settings: 'wght' 200;">
                auto_awesome
            </span>
</div>
<!-- Main Content (Names & Intro) -->
<section class="flex flex-col items-center space-y-md z-10 w-full fade-in-up delay-1">
<p class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-widest">
                Together with their families
            </p>
<div class="flex flex-col items-center space-y-unit floating-text">
<h1 class="font-display-lg-mobile text-display-lg-mobile text-primary">Elias</h1>
<span class="font-headline-md text-headline-md text-secondary/60 italic">&amp;</span>
<h1 class="font-display-lg-mobile text-display-lg-mobile text-primary">Amara</h1>
</div>
<p class="font-body-md text-body-md text-on-surface-variant italic mt-sm">
                Request the honor of your presence<br/>at their wedding celebration
            </p>
</section>
<!-- Details -->
<section class="flex flex-col items-center space-y-md z-10 w-full bg-surface-container-lowest/50 backdrop-blur-md rounded-xl p-md border border-primary-container/20 fade-in-up delay-2">
<div class="text-center">
<p class="font-headline-md text-headline-md text-primary">Saturday</p>
<p class="font-body-lg text-body-lg text-on-surface-variant">October 14th, 2024</p>
<p class="font-label-sm text-label-sm text-secondary/80 mt-unit uppercase tracking-widest">at five o'clock in the evening</p>
</div>
<div class="w-12 h-[1px] bg-primary-container/50"></div>
<div class="text-center">
<p class="font-body-md text-body-md text-on-surface-variant">The Grand Conservatory</p>
<p class="font-label-sm text-label-sm text-on-surface-variant/70 mt-unit">123 Botanical Way, Cityville</p>
</div>
</section>
<!-- Bottom Actions / QR -->
<section class="flex flex-col items-center space-y-sm z-10 w-full pb-md fade-in-up delay-3">
<div class="w-24 h-24 bg-surface rounded-lg p-2 border border-primary-container/30 shadow-sm relative group overflow-hidden">
<!-- Decorative QR Code Placeholder -->
<div class="w-full h-full bg-surface-container-high rounded flex items-center justify-center border border-dashed border-outline-variant">
<span class="material-symbols-outlined text-outline text-3xl">
                        qr_code_2
                    </span>
</div>
<div class="absolute inset-0 bg-primary/5 backdrop-blur-sm flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity duration-300">
<span class="font-label-sm text-label-sm text-primary">Scan to RSVP</span>
</div>
</div>
<p class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-widest opacity-60">
                Kindly RSVP by Sept 14
            </p>
</section>
