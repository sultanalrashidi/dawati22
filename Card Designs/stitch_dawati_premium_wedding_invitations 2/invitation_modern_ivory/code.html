<style>
        .texture-bg {
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.05'/%3E%3C/svg%3E");

            box-shadow: 0 0 40px rgba(229, 211, 179, 0.15); /* Champagne primary-container */

<body class="bg-surface-container-low min-h-screen flex items-center justify-center p-4 antialiased">
<!-- The Standalone 9:16 Card -->
<main class="relative w-full max-w-[400px] aspect-[9/16] texture-bg glow-shadow rounded-none sm:rounded-lg overflow-hidden border-thin flex flex-col items-center justify-between py-12 px-8 text-center text-on-surface">
<!-- Top Decorative Elements -->
<div class="absolute top-0 left-0 w-full h-24 pointer-events-none flex justify-between p-4">
<div class="w-16 h-16 border-t border-r border-thin opacity-50"></div>
<div class="w-16 h-16 border-t border-l border-thin opacity-50"></div>
</div>
<!-- Header -->
<header class="space-y-4 z-10">
<p class="font-arabic-body text-body-md text-on-surface-variant/80 tracking-widest">بكل حب وسعادة</p>
<p class="font-arabic-body text-label-sm uppercase tracking-[0.2em] text-outline">دعوة زفاف</p>
</header>
<!-- Main Typography -->
<section class="flex flex-col items-center justify-center z-10 flex-grow space-y-8">
<div class="relative">
<h1 class="font-arabic-display text-[64px] leading-none text-primary drop-shadow-sm whitespace-nowrap">سارة &amp; محمد</h1>
<!-- Subtle geometric background behind names -->
<div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-48 h-48 border border-primary-container rounded-full opacity-20 pointer-events-none"></div>
</div>
<!-- Guest Invitation Line -->
<div class="py-6 border-y border-outline-variant/30 w-full">
<p class="font-arabic-body text-body-lg text-on-surface-variant">نتشرف بدعوتكم<br/><span class="font-bold text-primary mt-2 block">أم خالد</span></p>
</div>
</section>
<!-- Details -->
<section class="w-full space-y-6 z-10 mt-4">
<div class="flex justify-between items-center w-full px-4 border border-outline-variant/20 py-4 bg-surface/50 backdrop-blur-sm">
<div class="text-center flex-1">
<span class="block font-arabic-body text-label-sm text-outline mb-1">اليوم</span>
<span class="block font-arabic-body text-body-md text-on-surface font-medium">السبت 15 نوفمبر 2026</span>
</div>
<div class="w-px h-8 bg-outline-variant/30 mx-2"></div>
<div class="text-center flex-1">
<span class="block font-arabic-body text-label-sm text-outline mb-1">الوقت</span>
<span class="block font-arabic-body text-body-md text-on-surface font-medium">09:00 مساءً</span>
</div>
</div>
<div class="flex items-center justify-center space-x-2 space-x-reverse text-on-surface-variant">
<span class="material-symbols-outlined text-[18px]" style="font-variation-settings: 'FILL' 0;">location_on</span>
<span class="font-arabic-body text-body-md">قاعة النخبة - الرياض</span>
</div>
</section>
<!-- Footer: Countdown & QR -->
<footer class="w-full flex flex-col items-center space-y-6 mt-8 z-10">
<!-- Countdown -->
<div class="flex items-center justify-center space-x-4 space-x-reverse font-label-sm text-outline tracking-widest" dir="ltr">
<div class="flex flex-col items-center"><span class="text-primary font-bold text-body-lg">12</span><span class="text-[10px]">DAYS</span></div>
<span class="text-outline-variant mb-4">:</span>
<div class="flex flex-col items-center"><span class="text-primary font-bold text-body-lg">08</span><span class="text-[10px]">HOURS</span></div>
<span class="text-outline-variant mb-4">:</span>
<div class="flex flex-col items-center"><span class="text-primary font-bold text-body-lg">42</span><span class="text-[10px]">MINS</span></div>
</div>
<!-- Minimalist QR (Visual representation) -->
<div class="w-16 h-16 border-thin p-1 bg-surface-container-lowest flex items-center justify-center opacity-80 mix-blend-multiply">
<!-- Using a pattern to simulate a clean QR code instead of an image to keep it lightweight and structural -->
<div class="w-full h-full bg-[radial-gradient(circle_at_2px_2px,_#6a5d43_1px,_transparent_0)] bg-[length:4px_4px]"></div>
</div>
</footer>
<!-- Bottom Decorative Elements -->
<div class="absolute bottom-0 left-0 w-full h-24 pointer-events-none flex justify-between p-4 items-end">
<div class="w-16 h-16 border-b border-r border-thin opacity-50"></div>
<div class="w-16 h-16 border-b border-l border-thin opacity-50"></div>
</div>
