<style>
        .input-border-transition {
            transition: border-color 0.3s ease-in-out, border-width 0.3s ease-in-out;
        }
        .input-focus-effect:focus {
            outline: none;
            border-bottom-width: 2px;
            border-color: #e5d3b3; /* primary-container */
        }
        .glow-shadow {
            box-shadow: 0 10px 40px -10px rgba(229, 211, 179, 0.3); /* primary-container shadow */
        }

<body class="bg-background text-on-background min-h-screen flex flex-col md:flex-row antialiased selection:bg-primary-container selection:text-on-primary-container">
<!-- Image Canvas (Hidden on mobile, takes 50% on desktop) -->
<div class="hidden md:block md:w-1/2 relative bg-surface-variant overflow-hidden">
<div class="absolute inset-0 bg-gradient-to-t from-background/40 to-transparent z-10"></div>
<img class="w-full h-full object-cover" data-alt="A luxurious, minimalist still-life photograph featuring soft, diffused lighting. The composition includes an elegant, high-end invitation card resting on a pristine, textured surface, surrounded by subtle floral elements and soft shadows. The color palette emphasizes warm champagnes, soft whites, and deep charcoal grays, embodying a serene, sophisticated editorial aesthetic." src="https://lh3.googleusercontent.com/aida-public/AB6AXuB1EPAf3Kwau166MwonOZ0V7IrzhSW0VBhsauUxoYHz4x5sSXFflO_7GmYqMbgivHJCZMetXxwY-8G0Gro3OM3XBIZcZ2JEWNdQOp3DGY9tHE0bf8dIxErGc8-2PsXmb9I6k4jjohzo5ZeKDISF1vENHhf8Lsfx_bkdPt_IiVAJeoIwXHUtN1fru5md1qxUbEZy15uG5oqmRdbv2W3Ftjm6hIQzHX9EArEgSF9-G_4yvbh442FDHaRH"/>
<!-- Brand Overlay -->
<div class="absolute bottom-margin-desktop left-margin-desktop z-20">
<h2 class="font-headline-md text-headline-md text-on-surface tracking-tight mb-sm">Dawati | دعوتي</h2>
<p class="font-body-lg text-body-lg text-on-surface-variant max-w-sm">Curating elegant experiences, one invitation at a time.</p>
</div>
</div>
<!-- Form Canvas (Takes full width on mobile, 50% on desktop) -->
<div class="w-full md:w-1/2 flex flex-col min-h-screen px-margin-mobile md:px-margin-desktop py-xl justify-center relative bg-background">
<!-- Mobile Brand (Hidden on desktop) -->
<div class="md:hidden absolute top-margin-mobile left-margin-mobile">
<h1 class="font-headline-md text-headline-md text-primary tracking-tight">Dawati | دعوتي</h1>
</div>
<div class="w-full max-w-md mx-auto space-y-xl">
<!-- Header -->
<div class="space-y-sm">
<h1 class="font-display-lg-mobile md:font-display-lg text-display-lg-mobile md:text-display-lg text-on-surface tracking-tight">Create Account</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Join Dawati to begin crafting your timeless invitations.</p>
</div>
<!-- Form -->
<form class="space-y-lg">
<!-- Full Name Input -->
<div class="relative group">
<label class="block font-label-sm text-label-sm text-on-surface-variant mb-xs transition-colors group-focus-within:text-primary" for="fullName">Full Name</label>
<input class="w-full bg-transparent border-0 border-b border-outline-variant py-sm px-0 font-body-md text-body-md text-on-surface input-border-transition input-focus-effect focus:ring-0 placeholder:text-on-surface-variant/40" id="fullName" name="fullName" placeholder="Jane Doe" type="text"/>
</div>
<!-- Email Input -->
<div class="relative group">
<label class="block font-label-sm text-label-sm text-on-surface-variant mb-xs transition-colors group-focus-within:text-primary" for="email">Email Address</label>
<input class="w-full bg-transparent border-0 border-b border-outline-variant py-sm px-0 font-body-md text-body-md text-on-surface input-border-transition input-focus-effect focus:ring-0 placeholder:text-on-surface-variant/40" id="email" name="email" placeholder="jane@example.com" type="email"/>
</div>
<!-- Password Input -->
<div class="relative group">
<label class="block font-label-sm text-label-sm text-on-surface-variant mb-xs transition-colors group-focus-within:text-primary" for="password">Password</label>
<input class="w-full bg-transparent border-0 border-b border-outline-variant py-sm px-0 font-body-md text-body-md text-on-surface input-border-transition input-focus-effect focus:ring-0 placeholder:text-on-surface-variant/40" id="password" name="password" placeholder="••••••••" type="password"/>
<button class="absolute right-0 bottom-sm text-on-surface-variant/60 hover:text-primary transition-colors focus:outline-none" type="button">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">visibility</span>
</button>
</div>
<!-- Actions -->
<div class="pt-sm space-y-md">
<button class="w-full bg-primary-container text-on-primary-container font-label-sm text-label-sm py-md px-lg rounded-full flex items-center justify-center gap-xs glow-shadow hover:scale-[0.98] transition-transform duration-200 focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2 focus:ring-offset-background" type="submit">
<span>Sign Up</span>
<span class="material-symbols-outlined text-[18px]">arrow_forward</span>
</button>
<div class="text-center">
<p class="font-body-md text-body-md text-on-surface-variant">
                            Already have an account? 
                            <a class="text-primary hover:text-on-surface transition-colors font-medium underline underline-offset-4 decoration-primary/30 hover:decoration-primary" href="#">Sign In</a>
</p>
</div>
</div>
</form>
</div>
</div>
</body></html>
