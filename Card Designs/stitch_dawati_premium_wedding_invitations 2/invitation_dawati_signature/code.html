<style>
        .aspect-9-16 {
            aspect-ratio: 9 / 16;
        }
        
        /* Fine line animations */
        @keyframes drawLine {
            from { height: 0; }
            to { height: 100%; }
        }
        @keyframes drawLineHorizontal {
            from { width: 0; }
            to { width: 100%; }
        }
        .line-vertical-reveal {
            animation: drawLine 2s cubic-bezier(0.4, 0, 0.2, 1) forwards;
        }
        .line-horizontal-reveal {
            animation: drawLineHorizontal 2s cubic-bezier(0.4, 0, 0.2, 1) forwards;
        }
        
        /* Glassmorphism utilities */
        .glass-panel {
            background: rgba(252, 249, 248, 0.4);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(229, 211, 179, 0.3);
        }
        
        /* Subtle glow shadow for primary actions */
        .glow-shadow {
            box-shadow: 0 10px 40px -10px rgba(229, 211, 179, 0.5);
        }
    </style>
</head>
<body class="bg-background text-on-background font-body-md min-h-screen flex items-center justify-center p-4 md:p-8 overflow-hidden">
<!-- Background Atmospheric Image -->
<div class="fixed inset-0 z-0 pointer-events-none opacity-40">
<div class="w-full h-full bg-cover bg-center" data-alt="A macro photograph of highly textured, premium ivory cotton paper with extremely subtle, debossed geometric patterns and soft, diffuse natural light raking across the surface to emphasize the tactile quality. The palette is strictly warm whites and subtle champagne tones." style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuAyNmeQePqzLg8HGAQA4boNd74rSuHpERiOanfbjrhBcVdQhLf_Lr36325jrl06Sr1d_WLq49Wu6Pj9gmDelYLjcEH5QO6AFoSqYwIsJnOFcnJMpbJBnEV1RBqoryHgoGRubblSXKtYSXHXK7AGbt0ruxtSHfxSNJj3MHqHll4__Dfvpyke_R60YT9BmM4aJhHNAQPK5HDHi8ro9mnoXQfxZu68KnjZNIyJuKHZgw4Xnpx8DxmxV39k')"></div>
</div>
<!-- Main Container: 9:16 Aspect Ratio -->
<main class="relative z-10 w-full max-w-[400px] aspect-9-16 bg-surface-container-lowest overflow-hidden shadow-2xl rounded-xl flex flex-col items-center justify-between py-12 px-8 border border-outline-variant/30">
<!-- Decorative Lines -->
<div class="absolute top-0 bottom-0 left-6 w-[1px] bg-primary/20 line-vertical-reveal origin-top"></div>
<div class="absolute top-0 bottom-0 right-6 w-[1px] bg-primary/20 line-vertical-reveal origin-bottom"></div>
<div class="absolute top-8 left-0 right-0 h-[1px] bg-primary/20 line-horizontal-reveal origin-left"></div>
<div class="absolute bottom-8 left-0 right-0 h-[1px] bg-primary/20 line-horizontal-reveal origin-right"></div>
<!-- Header / Bismillah -->
<header class="text-center w-full relative z-20 mt-4 opacity-0 transition-opacity duration-1000 delay-300" id="anim-header">
<div class="font-display-lg-mobile text-primary tracking-widest mb-2" dir="rtl">
                بسم الله الرحمن الرحيم
            </div>
<p class="font-label-sm text-on-surface-variant uppercase tracking-widest">In the name of Allah, the Most Gracious</p>
</header>
<!-- Central Content: Names & Invitation -->
<section class="flex flex-col items-center justify-center flex-grow w-full z-20 space-y-lg opacity-0 transition-opacity duration-1000 delay-500" id="anim-content">
<!-- Host Families -->
<div class="text-center space-y-2">
<p class="font-body-md text-on-surface-variant">The families of</p>
<p class="font-headline-md text-primary tracking-wide">Al-Saud &amp; Al-Rashid</p>
<p class="font-body-md text-on-surface-variant">request the honor of your presence</p>
<p class="font-body-md text-on-surface-variant">at the wedding reception of</p>
</div>
<!-- Couple Names -->
<div class="text-center w-full py-6 relative">
<div class="absolute inset-x-0 top-1/2 h-[1px] bg-primary/10 -z-10"></div>
<h1 class="font-display-lg-mobile text-display-lg-mobile md:font-display-lg md:text-display-lg text-primary bg-surface-container-lowest px-4 inline-block">
                    Faisal &amp; Noura
                </h1>
</div>
<!-- Date & Time Box -->
<div class="glass-panel w-full p-6 text-center space-y-4 relative overflow-hidden group">
<div class="absolute inset-0 bg-primary/5 transform -skew-x-12 -translate-x-full group-hover:translate-x-full transition-transform duration-1000 ease-in-out"></div>
<div class="flex justify-between items-center px-4">
<div class="text-right">
<p class="font-headline-md text-primary">Friday</p>
<p class="font-label-sm text-on-surface-variant uppercase tracking-widest mt-1">Oct</p>
</div>
<div class="h-12 w-[1px] bg-primary/30 mx-4"></div>
<div class="text-center">
<p class="font-display-lg-mobile text-primary">24</p>
</div>
<div class="h-12 w-[1px] bg-primary/30 mx-4"></div>
<div class="text-left">
<p class="font-headline-md text-primary">2025</p>
<p class="font-label-sm text-on-surface-variant uppercase tracking-widest mt-1">8:00 PM</p>
</div>
</div>
</div>
</section>
<!-- Footer / Venue & Actions -->
<footer class="w-full relative z-20 flex flex-col items-center space-y-6 mb-4 opacity-0 transition-opacity duration-1000 delay-700" id="anim-footer">
<div class="text-center">
<p class="font-headline-md text-primary">Ritz-Carlton</p>
<p class="font-body-md text-on-surface-variant mt-1">Riyadh, Saudi Arabia</p>
</div>
<!-- Action Buttons -->
<div class="flex flex-col w-full space-y-3 px-4">
<button class="w-full bg-primary-container text-on-primary-container font-label-sm uppercase tracking-widest py-4 px-6 rounded-sm hover:scale-98 transition-transform duration-200 glow-shadow flex items-center justify-center gap-2">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">done_all</span>
                    RSVP Now
                </button>
<button class="w-full bg-transparent border border-primary-container text-primary font-label-sm uppercase tracking-widest py-4 px-6 rounded-sm hover:scale-98 transition-transform duration-200 flex items-center justify-center gap-2">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">location_on</span>
                    View Details
                </button>
</div>
</footer>
</main>
<script>
        // Simple entrance animation orchestrator
        document.addEventListener("DOMContentLoaded", () => {
            setTimeout(() => {
                document.getElementById('anim-header').classList.remove('opacity-0');
            }, 300);
            setTimeout(() => {
                document.getElementById('anim-content').classList.remove('opacity-0');
            }, 800);
            setTimeout(() => {
                document.getElementById('anim-footer').classList.remove('opacity-0');
            }, 1300);
        });
    </script>
</body></html>
