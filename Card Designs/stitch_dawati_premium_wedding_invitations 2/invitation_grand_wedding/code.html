<style>
        body {
            background-color: #000; /* Dark background to highlight the card */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        
        .invitation-card {
            width: 100%;
            max-width: 450px;
            aspect-ratio: 9/16;
            background-color: #fcf9f8; /* background */
            position: relative;
            overflow: hidden;
            box-shadow: 0 25px 50px -12px rgba(106, 93, 67, 0.15); /* primary tint shadow */
        }

        /* Abstract Stage Layers */
        .layer-bg {
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, #fcf9f8 0%, #f6f3f2 100%);
        }

        .layer-arch {
            position: absolute;
            top: 5%;
            left: 5%;
            right: 5%;
            bottom: 5%;
            border: 1px solid rgba(229, 211, 179, 0.5); /* primary-container */
            border-radius: 1000px 1000px 0 0;
        }

        .layer-arch-inner {
            position: absolute;
            top: 10%;
            left: 10%;
            right: 10%;
            bottom: 10%;
            background: linear-gradient(to bottom, rgba(229, 211, 179, 0.1), transparent);
            border-radius: 1000px 1000px 0 0;
            backdrop-filter: blur(10px);
        }
        
        .layer-arch-inner::before {
            content: '';
            position: absolute;
            inset: -1px;
            border-radius: inherit;
            background: linear-gradient(to bottom, #d6c4a5, transparent);
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            padding: 1px;
        }

        .glow-effect {
            position: absolute;
            top: -20%;
            left: 50%;
            transform: translateX(-50%);
            width: 80%;
            height: 40%;
            background: radial-gradient(circle, rgba(243, 224, 192, 0.4) 0%, transparent 70%); /* primary-fixed */
            filter: blur(30px);
            z-index: 1;
        }

        .content-container {
            position: relative;
            z-index: 10;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 48px 24px; /* padding-lg and md */
            text-align: center;
        }

        .floral-abstract-top {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 30%;
            background: radial-gradient(ellipse at top, rgba(229, 211, 179, 0.2) 0%, transparent 70%);
            opacity: 0.8;
            mix-blend-mode: multiply;
        }

        .floral-abstract-bottom {
            position: absolute;
            bottom: -10%;
            left: -10%;
            width: 120%;
            height: 40%;
            background: radial-gradient(ellipse at bottom, rgba(214, 196, 165, 0.3) 0%, transparent 70%); /* inverse-primary */
            filter: blur(20px);
        }

        .divider {
            width: 40px;
            height: 1px;
            background-color: rgba(106, 93, 67, 0.3); /* primary */
            margin: 24px auto;
        }
        
        .sparkle {
            position: absolute;
            width: 2px;
            height: 2px;
            background-color: #f3e0c0;
            border-radius: 50%;
            box-shadow: 0 0 10px 2px rgba(243, 224, 192, 0.8);
            opacity: 0;
            animation: twinkle 4s infinite alternate;
        }

        @keyframes twinkle {
            0% { opacity: 0; transform: scale(0.5); }
            50% { opacity: 1; transform: scale(1.2); }
            100% { opacity: 0; transform: scale(0.5); }
        }
    </style>
</head>
<body class="bg-background text-on-background antialiased selection:bg-primary-container selection:text-on-primary-container">
<div class="invitation-card">
<!-- Abstract Layers for "Stage" feeling -->
<div class="layer-bg"></div>
<div class="layer-arch"></div>
<div class="layer-arch-inner"></div>
<div class="glow-effect"></div>
<div class="floral-abstract-top"></div>
<div class="floral-abstract-bottom"></div>
<!-- Animated Sparkles -->
<div class="sparkle" style="top: 15%; left: 20%; animation-delay: 0s;"></div>
<div class="sparkle" style="top: 25%; right: 15%; animation-delay: 1.5s;"></div>
<div class="sparkle" style="top: 70%; left: 25%; animation-delay: 0.7s;"></div>
