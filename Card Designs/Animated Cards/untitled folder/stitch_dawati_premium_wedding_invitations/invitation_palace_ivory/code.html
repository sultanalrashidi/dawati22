<style>

            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;

<body class="bg-surface text-on-surface h-screen w-screen flex items-center justify-center overflow-hidden">
<!-- Container mimicking a mobile device aspect ratio -->
<div class="relative w-full max-w-[400px] h-[100dvh] max-h-[850px] stone-texture mx-auto shadow-2xl flex flex-col justify-between overflow-hidden">
<!-- Noise Texture Overlay for subtle stone feel -->
<div class="noise-overlay"></div>
<!-- Inner Frame (Editorial Style) -->
<div class="absolute inset-[16px] thin-border pointer-events-none z-20"></div>
<div class="absolute inset-[24px] border-t border-b border-primary/10 pointer-events-none z-20"></div>
<!-- Top Section: Invitation Intro -->
<div class="pt-[60px] px-margin-mobile text-center z-30 relative">
<span class="material-symbols-outlined text-primary/40 text-[32px] mb-4" data-weight="fill" style="font-variation-settings: 'FILL' 0;">brightness_empty</span>
<p class="font-body-sm text-body-sm text-on-surface-variant/80 tracking-widest uppercase mt-2">دعوة زفاف</p>
</div>
<!-- Middle Section: Bride & Groom & Guest -->
<div class="flex-grow flex flex-col items-center justify-center px-margin-mobile text-center z-30 relative">
<!-- Bride & Groom -->
<div class="mb-lg relative">
<div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-32 h-32 bg-primary-container/20 rounded-full blur-2xl -z-10"></div>
<h1 class="font-display-lg-mobile text-display-lg-mobile text-primary mb-2">سارة</h1>
<div class="flex items-center justify-center gap-4 my-2">
<div class="h-[1px] w-12 bg-primary/20"></div>
<span class="font-headline-md text-headline-md text-on-surface-variant/60">&amp;</span>
<div class="h-[1px] w-12 bg-primary/20"></div>
</div>
<h1 class="font-display-lg-mobile text-display-lg-mobile text-primary">محمد</h1>
</div>
<!-- Personalized Guest Message -->
<div class="mt-lg mb-md max-w-[80%] mx-auto">
<p class="font-body-sm text-body-sm text-on-surface-variant/80 leading-relaxed mb-4">
                    بكل حب وسعادة يسرنا<br/>دعوتكم لمشاركتنا فرحتنا
                </p>
<h2 class="font-headline-md text-headline-md text-on-surface">أم خالد</h2>
</div>
</div>
<!-- Bottom Section: Details, Countdown & QR -->
<div class="pb-[60px] px-margin-mobile text-center z-30 relative flex flex-col items-center">
<!-- Details -->
<div class="mb-md">
<p class="font-body-sm text-body-sm text-on-surface-variant mb-1">السبت 15 نوفمبر 2026</p>
<p class="font-body-sm text-body-sm text-on-surface-variant mb-1">09:00 مساءً</p>
<p class="font-body-sm text-body-sm text-on-surface-variant font-semibold">قاعة النخبة - الرياض</p>
</div>
<!-- Countdown -->
<div class="font-body-lg text-body-lg text-primary tracking-[0.2em] mb-md flex items-center justify-center gap-2" dir="ltr">
<span>12</span>
<span class="text-primary/50">:</span>
<span>08</span>
<span class="text-primary/50">:</span>
<span>42</span>
</div>
<!-- QR Code Placeholder -->
<div class="w-16 h-16 border border-primary/20 p-1 bg-surface-container-lowest mt-2 shadow-sm">
<!-- Using a subtle placeholder image for the QR code -->
