<style>
        .glass-panel {
            background: rgba(252, 249, 248, 0.7);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(229, 211, 179, 0.3);
        }
        
        .success-glow {
            box-shadow: 0 0 40px rgba(229, 211, 179, 0.2);
        }
        
        .success-animation {
            animation: popIn 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
        
        @keyframes popIn {
            0% { transform: scale(0.8); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .check-draw {
            stroke-dasharray: 100;
            stroke-dashoffset: 100;
            animation: drawCheck 0.8s ease-out 0.2s forwards;
        }

        @keyframes drawCheck {
            to { stroke-dashoffset: 0; }
        }
    </style>
</head>
<body class="bg-background text-on-background min-h-screen flex flex-col font-body-md overflow-x-hidden selection:bg-primary-container selection:text-on-primary-container">
<!-- Top Navigation (Hidden on transactional flow, kept only for structural completeness if needed, but suppressed per guidelines) -->
<!-- Navigation Shell Suppressed: Transactional/Task-Focused Screen -->
<main class="flex-grow flex items-center justify-center p-margin-mobile md:p-margin-desktop relative">
<!-- Abstract Background Elements for Premium Feel -->
<div class="fixed top-0 left-0 w-full h-full overflow-hidden -z-10 pointer-events-none">
<div class="absolute -top-[20%] -right-[10%] w-[50vw] h-[50vw] rounded-full bg-primary-container/20 blur-[100px]"></div>
<div class="absolute -bottom-[20%] -left-[10%] w-[60vw] h-[60vw] rounded-full bg-secondary-container/10 blur-[120px]"></div>
</div>
<div class="w-full max-w-md mx-auto">
<!-- Main Success Card -->
<div class="glass-panel rounded-xl p-md md:p-lg flex flex-col items-center text-center success-glow success-animation relative overflow-hidden">
<!-- Subtle Top Accent Line -->
<div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-transparent via-primary-container to-transparent"></div>
<!-- Large Checkmark -->
<div class="w-24 h-24 mb-sm relative flex items-center justify-center rounded-full bg-surface">
<svg class="w-12 h-12 text-primary" fill="none" stroke="currentColor" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path class="check-draw" d="M5 13l4 4L19 7" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
</svg>
<!-- Decorative ring -->
<div class="absolute inset-0 rounded-full border border-primary-container scale-[1.15] opacity-50"></div>
</div>
<h1 class="font-headline-md text-headline-md text-primary mb-xs">دعوة صالحة</h1>
<p class="font-body-md text-body-md text-on-surface-variant mb-lg">تم التحقق من الدعوة بنجاح.</p>
<!-- Guest Details Bento Box -->
<div class="w-full bg-surface-container-lowest border border-outline-variant/30 rounded-lg p-sm mb-lg shadow-[0_4px_20px_rgb(0,0,0,0.02)]">
<div class="flex items-center justify-between mb-sm border-b border-outline-variant/20 pb-sm">
<div class="flex items-center gap-xs">
<span class="material-symbols-outlined text-primary" style="font-variation-settings: 'FILL' 0;">person</span>
<span class="font-body-md text-body-md font-medium">أم فلان + 2 مرافقين</span>
</div>
<div class="bg-primary-container/30 text-on-primary-container px-xs py-1 rounded-full font-label-sm text-label-sm">
                            VVIP
                        </div>
</div>
<!-- Stats Grid -->
<div class="grid grid-cols-3 gap-xs text-center pt-xs">
<div class="flex flex-col">
<span class="font-label-sm text-label-sm text-on-surface-variant mb-1">المسموح</span>
<span class="font-headline-md text-headline-md text-on-background">3</span>
</div>
<div class="flex flex-col border-x border-outline-variant/20">
<span class="font-label-sm text-label-sm text-on-surface-variant mb-1">الدخول</span>
<span class="font-headline-md text-headline-md text-primary">1</span>
</div>
<div class="flex flex-col">
<span class="font-label-sm text-label-sm text-on-surface-variant mb-1">المتبقي</span>
<span class="font-headline-md text-headline-md text-secondary">2</span>
</div>
</div>
</div>
<!-- Primary Action -->
<button class="w-full bg-primary-container text-on-primary-container font-body-md text-body-md py-sm rounded-lg hover:opacity-90 hover:scale-[0.98] transition-all duration-200 flex items-center justify-center gap-xs" id="loginBtn">
                    تسجيل الدخول
                    <span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">login</span>
</button>
<!-- Secondary Action -->
<button class="mt-xs w-full bg-transparent border border-primary-container text-on-background font-body-md text-body-md py-sm rounded-lg hover:bg-surface-container-low hover:scale-[0.98] transition-all duration-200">
                    مسح دعوة أخرى
                </button>
<!-- Hidden Confirmation State (Shown via JS) -->
<div class="hidden absolute inset-0 bg-surface/95 backdrop-blur-md flex-col items-center justify-center p-md z-10 transition-opacity duration-300 opacity-0" id="confirmationState">
<span class="material-symbols-outlined text-primary text-display-lg mb-sm" style="font-variation-settings: 'FILL' 1;">check_circle</span>
<p class="font-headline-md text-headline-md text-on-background text-center">تم تسجيل الدخول بنجاح</p>
</div>
</div>
</div>
</main>
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const loginBtn = document.getElementById('loginBtn');
            const confirmationState = document.getElementById('confirmationState');

            if(loginBtn && confirmationState) {
                loginBtn.addEventListener('click', () => {
                    confirmationState.classList.remove('hidden');
                    // Slight delay to allow display:block to apply before animating opacity
                    setTimeout(() => {
                        confirmationState.classList.remove('opacity-0');
                        confirmationState.classList.add('opacity-100');
                    }, 10);
                    
                    // Optional: Reset or redirect after showing confirmation
                    setTimeout(() => {
                        // Action after confirmation
                        console.log('Redirecting or ready for next scan...');
                    }, 2000);
                });
            }
        });
    </script>
</body></html>
