<style>
        body {
            background-color: #f6f3f2; /* surface-container-low */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        .phone-container {
            width: 100%;
            max-width: 430px; /* Approximate iPhone Pro Max width */
            height: 100vh;
            max-height: 932px;
            background-color: #e4e2e1; /* surface-variant base */
            position: relative;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        @media (min-width: 768px) {
            .phone-container {
                height: 932px;
                border-radius: 40px;
                border: 12px solid #303030; /* inverse-surface for phone casing */
            }
        }

        /* Gradient Background to simulate the pillars of light */
        .invitation-bg {
            position: absolute;
            inset: 0;
            background: linear-gradient(90deg, 
                #fcf9f8 0%, 
                #e5d3b3 15%, /* primary-container */
                #fcf9f8 30%, 
                #fcf9f8 70%, 
                #e5d3b3 85%, 
                #fcf9f8 100%);
            opacity: 0.8;
            z-index: 1;
        }

        .content-overlay {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            height: 100%;
            padding: 60px 24px;
            text-align: center;
            color: #6a5d43; /* primary */
        }

        .amiri-text {
            font-family: 'Amiri', serif;
        }
        
        .separator-line {
            height: 1px;
            width: 40px;
            background-color: #6a5d43;
            margin: 16px auto;
            opacity: 0.3;
        }

<body class="bg-surface-container-low">
<div class="phone-container">

</div>
