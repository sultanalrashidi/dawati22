<!DOCTYPE html>

<html dir="rtl" lang="ar"><head>
<meta charset="utf-8"/>

<style>
        .custom-input {
            border: none;
            border-bottom: 1px solid #7d766c; /* outline color */
            border-radius: 0;
            background-color: transparent;
            padding-left: 0;
            padding-right: 0;
            transition: all 0.2s ease;
        }
        .custom-input:focus {
            outline: none;
            box-shadow: none;
            border-bottom: 2px solid #e5d3b3; /* primary-container (Champagne) */
        }
        .segmented-control-label {
            transition: all 0.2s ease;
        }
        input[type="radio"]:checked + .segmented-control-label {
            background-color: #f3e0c0; /* primary-fixed */
            color: #231a06; /* on-primary-fixed */
            border-color: #e5d3b3;
        }
    </style>

<body class="bg-background text-on-background font-body-md antialiased min-h-screen flex flex-col items-center">
<!-- Top App Bar -->
<header class="flex justify-between items-center px-margin-mobile h-16 w-full fixed top-0 left-0 bg-surface/80 dark:bg-surface-dim/80 backdrop-blur-xl docked full-width z-50 flat no shadows bg-surface dark:bg-surface-dim">
<button aria-label="العودة" class="text-outline dark:text-outline-variant hover:scale-95 transition-transform duration-200 p-2">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">arrow_back</span>
</button>
<h1 class="font-headline-md text-headline-md text-center text-primary dark:text-primary-fixed-dim">إضافة منظم</h1>
<div class="w-10"></div> <!-- Placeholder for balance -->
</header>
<!-- Main Content Canvas -->
<main class="flex-grow w-full max-w-[600px] mt-24 px-margin-mobile pb-32">
<!-- Header Text -->
<div class="mb-lg">
<p class="font-body-lg text-body-lg text-on-surface-variant leading-relaxed">
                أدخل بيانات المنظم لمنحه صلاحية مسح دعوات ضيوفك لهذا الحفل.
            </p>
</div>
<!-- Form Area -->
<form class="space-y-lg">
<!-- Input Fields Group -->
<div class="space-y-md">
<div class="relative">
<label class="font-label-sm text-label-sm text-outline mb-1 block" for="organizer-name">اسم المنظم</label>
<input class="w-full custom-input font-body-md text-body-md text-on-surface py-2" id="organizer-name" placeholder="الاسم الكامل" type="text"/>
</div>
<div class="relative mt-md">
<label class="font-label-sm text-label-sm text-outline mb-1 block" for="organizer-contact">رقم الجوال أو البريد الإلكتروني</label>
<input class="w-full custom-input font-body-md text-body-md text-on-surface py-2" id="organizer-contact" placeholder="+966 5X XXX XXXX" type="text"/>
</div>
</div>
<!-- Segmented Control for Role -->
<div class="mt-lg">
<label class="font-label-sm text-label-sm text-outline mb-sm block">صلاحية المنظم</label>
<div class="flex bg-surface-container-low rounded-lg p-1 border border-outline-variant/30">
<label class="flex-1 text-center relative cursor-pointer">
<input checked="" class="sr-only" name="role" type="radio" value="gate"/>
<span class="segmented-control-label block py-2 px-4 rounded-md font-body-md text-body-md text-on-surface-variant border border-transparent">
                            بوابة فقط
                        </span>
</label>
<label class="flex-1 text-center relative cursor-pointer">
<input class="sr-only" name="role" type="radio" value="full"/>
<span class="segmented-control-label block py-2 px-4 rounded-md font-body-md text-body-md text-on-surface-variant border border-transparent">
                            إدارة الحفل
                        </span>
</label>
</div>
</div>
<!-- Clarifying Subtext -->
<div class="bg-surface-variant/30 rounded-xl p-md mt-sm flex items-start gap-sm border border-outline-variant/20">
<span class="material-symbols-outlined text-outline mt-1 shrink-0" style="font-variation-settings: 'FILL' 0;">info</span>
<p class="font-body-md text-body-md text-on-surface-variant">
                    سيتمكن المنظم فقط من تسجيل دخول الضيوف ولا يمكنه الاطلاع على تفاصيل الحفل الأخرى.
                </p>
</div>
<!-- Submit Action Container -->
<div class="fixed bottom-0 left-0 w-full p-margin-mobile bg-surface/90 backdrop-blur-md border-t border-outline-variant/10 flex justify-center pb-safe sm:relative sm:bg-transparent sm:border-none sm:p-0 sm:mt-xl sm:block z-40">
<button class="w-full sm:w-auto bg-primary-container text-on-primary-container font-body-md text-body-md py-4 px-xl rounded-xl shadow-[0_15px_30px_-5px_rgba(229,211,179,0.2)] hover:scale-[0.98] active:scale-95 transition-all duration-200" type="button">
                    إرسال دعوة الانضمام
                </button>
</div>
<!-- Filler for fixed bottom button on mobile -->
<div class="h-24 sm:hidden block"></div>
</form>
</main>
<!-- Bottom Navigation Bar (Hidden on this transactional screen as per instruction: "Automatic Suppression: You MUST exclude the navigation shell if the page intent is: Linear/Transactional") -->
</body></html>
