<body class="bg-surface text-on-surface flex items-center justify-center min-h-screen p-margin-mobile">
<!-- Standalone 9:16 Invitation Card -->
<div class="champagne-gradient w-full max-w-[400px] aspect-[9/16] rounded-xl overflow-hidden shadow-2xl relative flex flex-col p-md">
<!-- Thin Frame -->
<div class="metallic-border absolute inset-sm rounded-lg pointer-events-none"></div>
<div class="absolute inset-md border-[0.5px] border-primary-fixed-dim/50 rounded pointer-events-none"></div>
<!-- Content Container -->
<div class="relative z-10 flex flex-col h-full justify-between items-center text-center py-lg px-sm">
<!-- Opening -->
<div class="space-y-xs opacity-80">
<p class="font-body-md text-body-md text-primary">بسم الله الرحمن الرحيم</p>
<p class="font-label-sm text-label-sm uppercase tracking-widest text-on-surface-variant">بكل حب وسرور</p>
</div>
<!-- Calligraphy Names -->
<div class="my-lg">
<h1 class="font-arabic-calligraphy text-6xl text-primary leading-tight mb-unit">
                    أحمد <span class="text-3xl mx-2 text-secondary">&amp;</span> سارة
                </h1>
</div>
<!-- Personalization -->
<div class="bg-surface-container-lowest/50 px-md py-sm rounded-full border border-primary-container backdrop-blur-sm my-sm">
<p class="font-headline-md text-headline-md text-on-surface">إلى أم خالد</p>
</div>
<!-- Announcement -->
<p class="font-body-lg text-body-lg text-on-surface-variant max-w-[280px]">
                نتشرف بدعوتكم لحضور حفل زفافنا وتناول طعام العشاء
            </p>
<!-- Event Details -->
<div class="w-full flex flex-col gap-sm my-md">
<div class="flex items-center justify-center gap-xs text-primary">
<span class="material-symbols-outlined text-[20px]" data-icon="calendar_month" style="font-variation-settings: 'FILL' 0;">calendar_month</span>
<span class="font-body-md text-body-md">الجمعة، ١٥ أكتوبر ٢٠٢٤</span>
</div>
<div class="flex items-center justify-center gap-xs text-primary">
<span class="material-symbols-outlined text-[20px]" data-icon="schedule" style="font-variation-settings: 'FILL' 0;">schedule</span>
<span class="font-body-md text-body-md">الساعة ٨:٠٠ مساءً</span>
</div>
<div class="flex items-center justify-center gap-xs text-primary">
<span class="material-symbols-outlined text-[20px]" data-icon="location_on" style="font-variation-settings: 'FILL' 0;">location_on</span>
<span class="font-body-md text-body-md">قاعة الاحتفالات الكبرى، الرياض</span>
</div>
</div>
<!-- Countdown / Footer -->
<div class="mt-auto w-full flex justify-between items-center border-t border-primary-container pt-sm">
<div class="text-right">
<p class="font-label-sm text-label-sm text-on-surface-variant mb-unit">تبقـى</p>
<p class="font-headline-md text-headline-md text-primary">١٤ يـوم</p>
</div>
<div class="w-16 h-16 bg-surface-container-lowest rounded-md flex items-center justify-center border border-primary-container p-unit">
