<!DOCTYPE html>

<html dir="rtl" lang="ar"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Palace Inspired Digital Invitation</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>

<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-secondary-container": "#795354",
                        "on-secondary-fixed": "#2f1314",
                        "secondary": "#7b5455",
                        "primary": "#6a5d43",
                        "surface-container-highest": "#e4e2e1",
                        "outline-variant": "#cec5b9",
                        "tertiary": "#5b5d6e",
                        "error": "#ba1a1a",
                        "secondary-fixed": "#ffdad9",
                        "on-error": "#ffffff",
                        "surface-variant": "#e4e2e1",
                        "secondary-container": "#fdcbcb",
                        "secondary-fixed-dim": "#ecbbba",
                        "primary-container": "#e5d3b3",
                        "inverse-on-surface": "#f3f0f0",
                        "error-container": "#ffdad6",
                        "on-background": "#1b1c1c",
                        "surface-dim": "#dcd9d9",
                        "inverse-primary": "#d6c4a5",
                        "on-secondary": "#ffffff",
                        "on-primary-container": "#675a41",
                        "on-tertiary-fixed-variant": "#434656",
                        "on-primary": "#ffffff",
                        "on-error-container": "#93000a",
                        "tertiary-fixed": "#e0e1f5",
                        "primary-fixed": "#f3e0c0",
                        "on-surface": "#1b1c1c",
                        "outline": "#7d766c",
                        "surface-tint": "#6a5d43",
                        "on-tertiary": "#ffffff",
                        "background": "#fcf9f8",
                        "on-primary-fixed": "#231a06",
                        "primary-fixed-dim": "#d6c4a5",
                        "on-primary-fixed-variant": "#51452d",
                        "surface-container": "#f0eded",
                        "surface-container-high": "#eae7e7",
                        "on-tertiary-container": "#595b6c",
                        "tertiary-fixed-dim": "#c4c5d9",
                        "surface": "#fcf9f8",
                        "on-tertiary-fixed": "#181b29",
                        "surface-container-lowest": "#ffffff",
                        "on-secondary-fixed-variant": "#603d3e",
                        "surface-bright": "#fcf9f8",
                        "on-surface-variant": "#4c463d",
                        "tertiary-container": "#d3d4e8",
                        "inverse-surface": "#303030",
                        "surface-container-low": "#f6f3f2"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "xl": "80px",
                        "sm": "16px",
                        "unit": "4px",
                        "lg": "48px",
                        "md": "24px",
                        "xs": "8px",
                        "margin-desktop": "120px",
                        "margin-mobile": "20px",
                        "gutter": "20px"
                    },
                    "fontFamily": {
                        "headline-md": ["Playfair Display"],
                        "label-sm": ["DM Sans"],
                        "body-lg": ["DM Sans"],
                        "display-lg-mobile": ["Playfair Display"],
                        "display-lg": ["Playfair Display"],
                        "body-md": ["DM Sans"]
                    },
                    "fontSize": {
                        "headline-md": ["24px", { "lineHeight": "1.3", "fontWeight": "500" }],
                        "label-sm": ["12px", { "lineHeight": "1.0", "letterSpacing": "0.05em", "fontWeight": "500" }],
                        "body-lg": ["18px", { "lineHeight": "1.6", "fontWeight": "400" }],
                        "display-lg-mobile": ["32px", { "lineHeight": "1.2", "fontWeight": "600" }],
                        "display-lg": ["48px", { "lineHeight": "1.1", "letterSpacing": "-0.02em", "fontWeight": "600" }],
                        "body-md": ["16px", { "lineHeight": "1.5", "fontWeight": "400" }]
                    }
                }
            }
        }
    </script>
<style>
        .arch-container {
            clip-path: path('M 0 200 C 0 90, 90 0, 200 0 L 200 0 C 310 0, 400 90, 400 200 L 400 800 L 0 800 Z');
        }
        @media (max-width: 400px) {
            .arch-container {
                clip-path: path('M 0 180 C 0 80, 80 0, 180 0 L 180 0 C 280 0, 360 80, 360 180 L 360 800 L 0 800 Z');
            }
        }
        
        .shimmer {
            position: relative;
            overflow: hidden;
        }
        .shimmer::after {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 50%;
            height: 100%;
            background: linear-gradient(to right, transparent, rgba(255,255,255,0.3), transparent);
            transform: skewX(-20deg);
            animation: shimmer 4s infinite;
        }
        @keyframes shimmer {
            0% { left: -100%; }
            100% { left: 200%; }
        }
    </style>
</head>
<body class="bg-surface text-on-surface min-h-screen flex items-center justify-center p-4">
<!-- Standalone 9:16 Invitation Card -->
<main class="relative w-full max-w-[400px] aspect-[9/16] bg-surface-container-lowest shadow-2xl overflow-hidden flex flex-col items-center justify-between border-[0.5px] border-primary-container">
<!-- Background Graphic Elements (Palace Inspired) -->
<div class="absolute inset-0 pointer-events-none flex flex-col justify-between">
<!-- Top Arch Graphic -->
<svg class="w-full h-auto text-primary-container opacity-30" fill="none" viewbox="0 0 400 150" xmlns="http://www.w3.org/2000/svg">
<path d="M0 0H400V150C400 150 300 50 200 50C100 50 0 150 0 150V0Z" fill="currentColor"></path>
<path d="M20 0V120C80 60 140 40 200 40C260 40 320 60 380 120V0" stroke="currentColor" stroke-width="1.5"></path>
</svg>
<!-- Bottom Symmetrical Base -->
<svg class="w-full h-auto text-primary-container opacity-30" fill="none" viewbox="0 0 400 100" xmlns="http://www.w3.org/2000/svg">
<path d="M0 100H400V0C400 0 300 80 200 80C100 80 0 0 0 0V100Z" fill="currentColor"></path>
<line stroke="currentColor" stroke-width="1" x1="50" x2="50" y1="100" y2="40"></line>
<line stroke="currentColor" stroke-width="1" x1="350" x2="350" y1="100" y2="40"></line>
</svg>
</div>
<!-- Inner Content Wrapper (The Arch) -->
<div class="relative w-[90%] h-[95%] mt-[2.5%] border-[1px] border-primary-container/60 arch-container flex flex-col items-center p-md bg-surface-bright/50 backdrop-blur-sm">
<!-- Header Section -->
<div class="mt-xl flex flex-col items-center text-center space-y-sm w-full">
<div class="w-12 h-12 border border-primary/30 rounded-full flex items-center justify-center mb-sm">
<span class="material-symbols-outlined text-primary" data-icon="auto_awesome" style="font-variation-settings: 'FILL' 0;">auto_awesome</span>
</div>
<p class="font-label-sm text-label-sm text-on-surface-variant tracking-widest uppercase">تتشرف عائلتي</p>
<div class="w-16 h-[1px] bg-primary-container/50"></div>
</div>
<!-- Central Focus: Names -->
<div class="flex-grow flex flex-col items-center justify-center w-full text-center space-y-md">
<h1 class="font-display-lg-mobile text-display-lg-mobile text-primary leading-tight shimmer">
                    سارة<br/>
<span class="font-body-md text-body-md text-primary/60 italic">&amp;</span><br/>
                    محمد
                </h1>
<div class="space-y-unit">
<p class="font-body-lg text-body-lg text-on-surface-variant">بدعوتكم لحضور حفل زفافهما</p>
<p class="font-label-sm text-label-sm text-outline tracking-wider">في ليلة من ليالي العمر</p>
</div>
</div>
<!-- Date & Time Box -->
<div class="w-full border-y-[0.5px] border-primary-container/50 py-sm my-md flex justify-between items-center px-sm">
<div class="text-center w-1/3">
<p class="font-label-sm text-label-sm text-outline mb-1">الخميس</p>
<p class="font-headline-md text-headline-md text-primary">١٥</p>
</div>
<div class="w-[1px] h-10 bg-primary-container/30"></div>
<div class="text-center w-1/3">
<p class="font-label-sm text-label-sm text-outline mb-1">نوفمبر</p>
<p class="font-headline-md text-headline-md text-primary">٢٠٢٤</p>
</div>
<div class="w-[1px] h-10 bg-primary-container/30"></div>
<div class="text-center w-1/3">
<p class="font-label-sm text-label-sm text-outline mb-1">المساء</p>
<p class="font-headline-md text-headline-md text-primary">٨:٠٠</p>
</div>
</div>
<!-- Footer: Countdown & Location -->
<div class="mt-auto mb-md w-full flex flex-col items-center space-y-md">
<!-- Countdown Ticker -->
<div class="flex justify-center gap-md w-full">
<div class="flex flex-col items-center">
<span class="font-body-md text-body-md text-primary">45</span>
<span class="font-label-sm text-label-sm text-outline-variant text-[10px]">يوم</span>
</div>
<div class="flex flex-col items-center">
<span class="font-body-md text-body-md text-primary">12</span>
<span class="font-label-sm text-label-sm text-outline-variant text-[10px]">ساعة</span>
</div>
<div class="flex flex-col items-center">
<span class="font-body-md text-body-md text-primary">30</span>
<span class="font-label-sm text-label-sm text-outline-variant text-[10px]">دقيقة</span>
</div>
</div>
<!-- Action Buttons -->
<div class="flex gap-sm w-full">
<button class="flex-1 bg-primary-container text-on-primary-container font-label-sm text-label-sm py-3 rounded-sm flex items-center justify-center gap-2 hover:scale-[0.98] transition-transform">
<span class="material-symbols-outlined text-[16px]" data-icon="location_on">location_on</span>
                        الموقع
                    </button>
<button class="flex-1 border-[1px] border-primary-container text-primary font-label-sm text-label-sm py-3 rounded-sm flex items-center justify-center gap-2 hover:bg-primary-container/10 transition-colors">
<span class="material-symbols-outlined text-[16px]" data-icon="qr_code_scanner">qr_code_scanner</span>
                        تأكيد الحضور
                    </button>
</div>
</div>
</div>
</main>
</body></html>
