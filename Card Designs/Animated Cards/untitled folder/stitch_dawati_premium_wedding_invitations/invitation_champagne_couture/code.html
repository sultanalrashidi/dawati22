<!DOCTYPE html>

<html dir="rtl" lang="ar"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>CHAMPAGNE COUTURE - سارة &amp; محمد</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@200..1000&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-error-container": "#93000a",
                        "secondary-container": "#fdcbcb",
                        "on-background": "#1b1c1c",
                        "on-primary-container": "#675a41",
                        "inverse-primary": "#d6c4a5",
                        "on-tertiary": "#ffffff",
                        "surface-container-lowest": "#ffffff",
                        "secondary": "#7b5455",
                        "primary-fixed": "#f3e0c0",
                        "surface-container-low": "#f6f3f2",
                        "primary-fixed-dim": "#d6c4a5",
                        "inverse-surface": "#303030",
                        "primary": "#6a5d43",
                        "on-secondary-fixed-variant": "#603d3e",
                        "error-container": "#ffdad6",
                        "inverse-on-surface": "#f3f0f0",
                        "tertiary-fixed-dim": "#c4c5d9",
                        "outline": "#7d766c",
                        "surface-container": "#f0eded",
                        "surface-tint": "#6a5d43",
                        "on-tertiary-container": "#595b6c",
                        "tertiary": "#5b5d6e",
                        "on-primary-fixed": "#231a06",
                        "on-error": "#ffffff",
                        "tertiary-fixed": "#e0e1f5",
                        "surface-variant": "#e4e2e1",
                        "surface-dim": "#dcd9d9",
                        "surface": "#fcf9f8",
                        "secondary-fixed": "#ffdad9",
                        "error": "#ba1a1a",
                        "on-secondary": "#ffffff",
                        "on-tertiary-fixed-variant": "#434656",
                        "on-surface": "#1b1c1c",
                        "primary-container": "#e5d3b3",
                        "on-primary-fixed-variant": "#51452d",
                        "on-secondary-container": "#795354",
                        "on-surface-variant": "#4c463d",
                        "on-tertiary-fixed": "#181b29",
                        "tertiary-container": "#d3d4e8",
                        "outline-variant": "#cec5b9",
                        "surface-container-high": "#eae7e7",
                        "surface-bright": "#fcf9f8",
                        "on-primary": "#ffffff",
                        "secondary-fixed-dim": "#ecbbba",
                        "surface-container-highest": "#e4e2e1",
                        "background": "#fcf9f8",
                        "on-secondary-fixed": "#2f1314"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "lg": "48px",
                        "sm": "16px",
                        "unit": "4px",
                        "md": "24px",
                        "margin-mobile": "20px",
                        "margin-desktop": "120px",
                        "xs": "8px",
                        "gutter": "20px",
                        "xl": "80px"
                    },
                    "fontFamily": {
                        "label-sm": ["DM Sans"],
                        "headline-md": ["Playfair Display"],
                        "body-md": ["DM Sans"],
                        "display-lg": ["Playfair Display"],
                        "body-lg": ["DM Sans"],
                        "display-lg-mobile": ["Playfair Display"],
                        "arabic-display": ["Cairo", "sans-serif"]
                    },
                    "fontSize": {
                        "label-sm": ["12px", { "lineHeight": "1.0", "letterSpacing": "0.05em", "fontWeight": "500" }],
                        "headline-md": ["24px", { "lineHeight": "1.3", "fontWeight": "500" }],
                        "body-md": ["16px", { "lineHeight": "1.5", "fontWeight": "400" }],
                        "display-lg": ["48px", { "lineHeight": "1.1", "letterSpacing": "-0.02em", "fontWeight": "600" }],
                        "body-lg": ["18px", { "lineHeight": "1.6", "fontWeight": "400" }],
                        "display-lg-mobile": ["32px", { "lineHeight": "1.2", "fontWeight": "600" }]

                }
            }
        }

<style>
        .champagne-gradient {
            background: linear-gradient(135deg, #f3e0c0 0%, #e5d3b3 50%, #d6c4a5 100%);
        }
        .text-champagne-gold {
            background: linear-gradient(135deg, #a67c00, #bf953f, #fcf6ba, #b38728, #fdbf59, #bf953f, #a67c00);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
    </style>
</head>
<body class="bg-surface text-on-surface font-body-md antialiased min-h-screen flex items-center justify-center p-4">
<!-- Invitation Canvas (9:16 Aspect Ratio approximation) -->
<main class="w-full max-w-[400px] aspect-[9/16] bg-background shadow-2xl relative overflow-hidden flex flex-col justify-between items-center py-16 px-8 border border-outline-variant/30">
<!-- Abstract Background Elements for High Fashion Feel -->
<div class="absolute inset-0 z-0 pointer-events-none opacity-20">
<div class="absolute top-[-10%] right-[-20%] w-[150%] h-[50%] bg-primary-container rounded-full blur-[100px]"></div>
<div class="absolute bottom-[-10%] left-[-20%] w-[150%] h-[50%] bg-surface-variant rounded-full blur-[100px]"></div>
</div>
<!-- Top Section: Bride & Groom Names -->
<section class="z-10 flex flex-col items-center justify-center w-full h-[40%] text-center space-y-4">
<h1 class="font-arabic-display text-[64px] font-black leading-none text-on-background tracking-tight">سارة</h1>
<span class="font-headline-md text-primary italic text-xl">&amp;</span>
<h1 class="font-arabic-display text-[64px] font-black leading-none text-on-background tracking-tight">محمد</h1>
</section>
<!-- Middle Section: Guest & Details -->
<section class="z-10 flex flex-col items-center text-center space-y-8 w-full mt-auto mb-8">
<div class="space-y-2">
<p class="font-body-sm text-on-surface-variant tracking-widest uppercase text-xs">بكل حب وسعادة يسرنا دعوتكم لمشاركتنا فرحتنا</p>
<h2 class="font-arabic-display text-3xl font-bold text-primary">أم خالد</h2>
</div>
<div class="space-y-1 w-full relative">
<div class="absolute top-1/2 left-0 w-full h-[1px] bg-gradient-to-r from-transparent via-outline-variant/50 to-transparent -z-10"></div>
<div class="bg-background px-4 inline-block">
<p class="font-arabic-display text-lg text-on-surface">السبت 15 نوفمبر 2026</p>
<p class="font-arabic-display text-md text-on-surface-variant">09:00 مساءً</p>
<p class="font-arabic-display text-md text-on-surface-variant">قاعة النخبة - الرياض</p>
</div>
</div>
</section>
<!-- Bottom Section: Countdown & QR -->
<section class="z-10 flex flex-col items-center space-y-6 w-full">
<div class="flex space-x-4 space-x-reverse items-center justify-center text-primary-fixed-dim font-display-lg-mobile tracking-widest text-2xl font-light">
<span>12</span>
<span class="text-on-surface-variant/30 pb-1">:</span>
<span>08</span>
<span class="text-on-surface-variant/30 pb-1">:</span>
<span>42</span>
</div>
<div class="w-16 h-16 p-1 bg-surface-container-lowest border border-primary-container shadow-sm flex items-center justify-center">
<!-- Decorative QR Code Placeholder -->
<div class="w-full h-full bg-primary/10 grid grid-cols-3 grid-rows-3 gap-[2px] p-[2px]">
<div class="bg-primary/80 col-span-2"></div><div class="bg-primary/40"></div>
<div class="bg-primary/50"></div><div class="bg-primary/90 col-span-2"></div>
<div class="bg-primary/70"></div><div class="bg-primary/30"></div><div class="bg-primary/80"></div>
</div>
</div>
</section>
<!-- Elegant Borders -->
<div class="absolute inset-4 border-[1px] border-primary-container/40 pointer-events-none z-0"></div>
<div class="absolute inset-5 border-[1px] border-primary-container/20 pointer-events-none z-0"></div>
</main>
</body></html>
