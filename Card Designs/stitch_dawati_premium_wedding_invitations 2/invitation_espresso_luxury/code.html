<style>body {
    /* Force dark mode background for this specific luxury design */
    background-color: #2c1c14;
    color: #e5d3b3;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    margin: 0;
    padding: 20px
    }
.invitation-card {
    aspect-ratio: 9/16;
    width: 100%;
    max-width: 450px;
    height: auto;
    max-height: 90vh;
    position: relative;
    overflow: hidden;
    border-radius: 24px;
    box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7)
    }
.texture-overlay {
    position: absolute;
    inset: 0;
    background-image: url(https://lh3.googleusercontent.com/aida-public/AB6AXuACCs11a8fNovmlXXpxUH09agbnedlyDdz35mgBiAqskKEKN0i5ZTfuYa1_bevJlUUbIWJvaJqiH1EGEEznPNyIAN_hEaxdTTHYZDdwBltWDl2GLpAhZJiy6z-ifFOg1HO2CVGr3DGjVlHIVYWTRgGHRftRIGJxiq2w8nwgyqGrwsz3G1_sqWR5IIrBqf6fZxBNDUaQKKb37M814KAbLtFTaapdEU3pDnhd8BQzUnYpTwJJ8QrCQ2Jp);
    background-size: cover;
    background-position: center;
    opacity: 0.4;
    mix-blend-mode: multiply;
    z-index: 1
    }
.content-layer {
    position: relative;
    z-index: 10;
    height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 40px 32px;
    text-align: center;
    border: 1px solid rgba(229, 211, 179, 0.15);
    /* Subtle cream border */
    border-radius: 24px
    }
.gold-line {
    height: 1px;
    width: 60%;
    background: linear-gradient(90deg, transparent, #e5d3b3, transparent);
    margin: 0 auto;
    opacity: 0.6
    }
.qr-container {
    background-color: rgba(229, 211, 179, 0.05);
    padding: 16px;
    border-radius: 12px;
    backdrop-filter: blur(4px);
    border: 1px solid rgba(229, 211, 179, 0.1);
    display: inline-block;
    margin: 0 auto
    }</style>
</head>
<body class="bg-background text-primary-container font-body-md">
<!-- Top Navigation (Hidden as per standalone card instruction, but keeping structure if needed later) -->
<!-- Content Canvas -->
<main class="w-full flex justify-center items-center">
<div class="invitation-card bg-surface-container-high">
<!-- Deep Espresso/Chocolate Wood Texture -->
<div class="texture-overlay" data-alt="A highly detailed, photorealistic close-up of dark espresso-colored rich walnut wood grain texture. The lighting is moody and dramatic, casting subtle highlights on the natural imperfections and deep grooves of the wood. The overall aesthetic is ultra-luxurious, dark, and sophisticated, perfect for a high-end wedding invitation background. Deep browns and near-blacks dominate the palette."></div>
<div class="content-layer">
<!-- Header / Bismillah -->
<div class="pt-4">
<p class="font-headline-md text-primary-container opacity-80 mb-6 text-sm tracking-widest">بِسْمِ اللَّهِ الرَّحْمَنِ الرَّحِيمِ</p>
<div class="gold-line mb-8"></div>
</div>
<!-- Main Names -->
<div class="flex-grow flex flex-col justify-center space-y-8 my-8">
<div>
<p class="font-body-md text-primary-container opacity-70 mb-2">نتشرف بدعوتكم لحضور حفل زفاف</p>
</div>
<div class="space-y-4">
<h1 class="font-display-lg-mobile text-primary-fixed drop-shadow-md">سارة</h1>
<p class="font-display-lg text-primary-fixed opacity-50">&amp;</p>
<h1 class="font-display-lg-mobile text-primary-fixed drop-shadow-md">محمد</h1>
</div>
</div>
<!-- Guest Name & Details -->
<div class="space-y-8 pb-4">
<div class="gold-line mb-6"></div>
<div class="space-y-2">
<p class="font-label-sm text-primary-container opacity-60 uppercase tracking-widest">الضيف الكريم</p>
<p class="font-headline-md text-primary-fixed text-xl">أم خالد</p>
</div>
<!-- QR Code Section -->
<div class="pt-4">
<div class="qr-container">
<img class="w-24 h-24 object-contain opacity-90 mx-auto" data-alt="A minimalist, high-contrast QR code design in light cream color on a transparent or very dark brown background. The QR code is clean, scannable, and elegant, fitting for a luxury digital wedding invitation. It is centered and has a subtle glowing effect to ensure readability against the dark wood background." src="https://lh3.googleusercontent.com/aida-public/AB6AXuCK79aaOVvBGplPutsJIhwezYGUcOQWMofXnGW9ZPOmofzQUGY8hKYa6kTYd138bbmhZqTMWTJfBuMLDJkP9QMGR9PRLZaPZbhdl8YZivBbz9kdx6RTYbW7PnhGHB4_aEwK2c_m913_55R7LBikgzUzTqr9HvNPIvpwZiAaQwa-lkIU9jP1-CS02ybOjmIF3gh55Ef53A5AzKtbqOmo-0WQq6BUS8vEH3oUxZhabT109X4WufXToH--"/>
<p class="font-label-sm mt-3 text-primary-container opacity-60">امسح لتأكيد الحضور</p>
</div>
</div>
<div class="pt-4 space-y-1">
<p class="font-label-sm text-primary-container opacity-50">الجمعة، ٢٤ مايو ٢٠٢٤</p>
<p class="font-label-sm text-primary-container opacity-50">فندق الريتز كارلتون، الرياض</p>
</div>
</div>
</div>
</div>
</main>
</body></html>
