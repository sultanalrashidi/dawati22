<!DOCTYPE html>

<style>
        .glass-panel {
            background: rgba(252, 249, 248, 0.7);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(229, 211, 179, 0.3);
        }
        .minimal-input {
            border: none;
            border-bottom: 1px solid #cec5b9;
            background: transparent;
            border-radius: 0;
            transition: all 0.3s ease;
        }
        .minimal-input:focus {
            outline: none;
            box-shadow: none;
            border-bottom: 2px solid #e5d3b3;
        }
        .glow-shadow {
            box-shadow: 0 10px 40px -10px rgba(229, 211, 179, 0.4);
        }
        /* Custom scrollbar for text area */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #cec5b9;
            border-radius: 10px;
        }
    </style>
</head>
<body class="bg-background text-on-background antialiased min-h-screen flex flex-col items-center">
<!-- Top Navigation (Transactional/Task-focused page -> No generic nav shell, just back/close logic via TopAppBar anchor instructions) -->
<header class="fixed top-0 w-full z-50 bg-surface/80 backdrop-blur-md flex items-center justify-between px-margin-mobile md:px-margin-desktop h-16 border-b border-outline-variant/20">
<button aria-label="Go back" class="text-primary hover:opacity-80 transition-opacity active:scale-95 flex items-center gap-2">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">arrow_forward</span>
<span class="font-label-sm text-label-sm hidden md:inline">Back</span>
</button>
<div class="font-headline-md text-headline-md-mobile text-primary font-bold">
            Dawati
        </div>
<button aria-label="More options" class="text-primary hover:opacity-80 transition-opacity active:scale-95">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">more_vert</span>
</button>
</header>
<main class="w-full max-w-[800px] px-margin-mobile md:px-gutter mt-24 mb-32 flex-grow">
<!-- Progress Indicator -->
<div class="mb-lg flex flex-col items-center">
<div class="font-label-sm text-label-sm text-outline tracking-widest uppercase mb-sm">Step 1 of 3</div>
<div class="flex gap-2 w-full max-w-[200px]">
<div class="h-1 flex-1 bg-primary rounded-full"></div>
<div class="h-1 flex-1 bg-surface-variant rounded-full"></div>
<div class="h-1 flex-1 bg-surface-variant rounded-full"></div>
</div>
<h1 class="font-display-lg-mobile md:font-display-lg text-display-lg-mobile md:text-display-lg mt-md text-center">Design Briefing</h1>
<p class="font-body-md text-body-md text-on-surface-variant text-center mt-xs">Let's start shaping your perfect invitation.</p>
</div>
<form class="space-y-lg glass-panel p-md md:p-lg rounded-xl">
<!-- Vision Text Area -->
<div class="space-y-xs">
<label class="font-headline-md text-headline-md-mobile md:text-headline-md block" for="vision">Describe your vision</label>
<p class="font-body-md text-body-md text-on-surface-variant/80 text-sm mb-4">Share your wedding theme, colors, and any specific elements you desire.</p>
<textarea class="w-full minimal-input font-body-md text-body-md py-3 resize-none" id="vision" placeholder="e.g., We are planning a romantic twilight garden wedding. We love deep greens mixed with soft champagne accents..." rows="5"></textarea>
</div>
<!-- Style Dropdown -->
<div class="space-y-xs pt-sm">
<label class="font-headline-md text-headline-md-mobile md:text-headline-md block" for="style">Invitation Style</label>
<div class="relative">
<select class="w-full minimal-input font-body-md text-body-md py-4 appearance-none cursor-pointer pr-10 bg-transparent" id="style">
<option disabled="" selected="" value="">Select a style direction</option>
<option value="traditional">Traditional Elegance</option>
<option value="modern">Modern Minimalist</option>
<option value="floral">Botanical &amp; Floral</option>
<option value="vintage">Vintage Glamour</option>
<option value="custom">Other / Custom</option>
</select>
<span class="material-symbols-outlined absolute left-0 top-1/2 -translate-y-1/2 pointer-events-none text-outline">expand_more</span>
</div>
</div>
<!-- Color Palette Section -->
<div class="space-y-sm pt-sm">
<label class="font-headline-md text-headline-md-mobile md:text-headline-md block">Color Palette</label>
<p class="font-body-md text-body-md text-on-surface-variant/80 text-sm mb-4">Select foundational tones or describe your specific palette.</p>
<div class="flex flex-wrap gap-4 mb-4">
<!-- Color Swatches -->
<label class="cursor-pointer group relative">
<input class="peer sr-only" name="colors" type="checkbox" value="ivory"/>
<div class="w-12 h-12 rounded-full border border-outline-variant bg-[#FDFBF7] flex items-center justify-center peer-checked:ring-2 peer-checked:ring-primary peer-checked:ring-offset-2 peer-checked:ring-offset-background transition-all">
<span class="material-symbols-outlined text-primary opacity-0 peer-checked:opacity-100 transition-opacity text-sm">check</span>
</div>
<span class="absolute -bottom-6 left-1/2 -translate-x-1/2 font-label-sm text-label-sm text-on-surface-variant opacity-0 group-hover:opacity-100 transition-opacity">Ivory</span>
</label>
<label class="cursor-pointer group relative">
<input class="peer sr-only" name="colors" type="checkbox" value="champagne"/>
<div class="w-12 h-12 rounded-full border border-outline-variant bg-[#E5D3B3] flex items-center justify-center peer-checked:ring-2 peer-checked:ring-primary peer-checked:ring-offset-2 peer-checked:ring-offset-background transition-all">
<span class="material-symbols-outlined text-primary opacity-0 peer-checked:opacity-100 transition-opacity text-sm">check</span>
</div>
<span class="absolute -bottom-6 left-1/2 -translate-x-1/2 font-label-sm text-label-sm text-on-surface-variant opacity-0 group-hover:opacity-100 transition-opacity whitespace-nowrap">Champagne</span>
</label>
<label class="cursor-pointer group relative">
<input class="peer sr-only" name="colors" type="checkbox" value="charcoal"/>
<div class="w-12 h-12 rounded-full border border-outline-variant bg-[#36454F] flex items-center justify-center peer-checked:ring-2 peer-checked:ring-primary peer-checked:ring-offset-2 peer-checked:ring-offset-background transition-all">
<span class="material-symbols-outlined text-white opacity-0 peer-checked:opacity-100 transition-opacity text-sm">check</span>
</div>
<span class="absolute -bottom-6 left-1/2 -translate-x-1/2 font-label-sm text-label-sm text-on-surface-variant opacity-0 group-hover:opacity-100 transition-opacity">Charcoal</span>
</label>
<label class="cursor-pointer group relative">
<input class="peer sr-only" name="colors" type="checkbox" value="rose"/>
<div class="w-12 h-12 rounded-full border border-outline-variant bg-[#D4A5A5] flex items-center justify-center peer-checked:ring-2 peer-checked:ring-primary peer-checked:ring-offset-2 peer-checked:ring-offset-background transition-all">
<span class="material-symbols-outlined text-white opacity-0 peer-checked:opacity-100 transition-opacity text-sm">check</span>
</div>
<span class="absolute -bottom-6 left-1/2 -translate-x-1/2 font-label-sm text-label-sm text-on-surface-variant opacity-0 group-hover:opacity-100 transition-opacity whitespace-nowrap">Dusty Rose</span>
</label>
</div>
<input class="w-full minimal-input font-body-md text-body-md py-3 mt-4" placeholder="Or type custom colors here..." type="text"/>
</div>
</form>
</main>
<!-- Bottom Action Bar (Fixed) -->
<div class="fixed bottom-0 w-full bg-surface/90 backdrop-blur-xl border-t border-outline-variant/10 p-margin-mobile md:px-margin-desktop z-40 flex justify-end">
<button class="bg-primary-container text-on-primary-fixed w-full md:w-auto px-xl py-4 rounded-full font-label-sm text-label-sm tracking-widest uppercase hover:scale-[0.98] transition-transform glow-shadow flex items-center justify-center gap-2">
<span>Continue</span>
<span class="material-symbols-outlined text-sm" style="font-variation-settings: 'FILL' 0;">arrow_back</span>
</button>
</div>
</body></html>
