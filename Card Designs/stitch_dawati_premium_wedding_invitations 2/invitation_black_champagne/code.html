        }

        /* Subtle fade-in animation for elegant entry */

            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-up {
            animation: fadeUp 1.2s cubic-bezier(0.22, 1, 0.36, 1) forwards;

<!-- Digital Invitation Card Container - 9:16 Aspect Ratio approximation for desktop, full height for mobile -->
<main class="relative w-full max-w-sm h-[100dvh] sm:h-auto sm:aspect-[9/16] bg-on-background shadow-2xl sm:shadow-glow overflow-hidden flex flex-col justify-between items-center py-xl px-lg text-center rounded-none sm:rounded-xl z-10 border border-primary/10">

<div class="absolute inset-0 bg-cover bg-center mix-blend-overlay opacity-30 pointer-events-none" data-alt="A highly detailed, abstract macro shot of luxurious, dark charcoal velvet fabric. The lighting is extremely soft and dramatic, creating subtle ripples and variations in the deep black texture. A very faint, warm golden light spills from the top right edge, implying a sophisticated evening setting. Minimalist, high-contrast editorial photography." style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuAzZzrHW_7K5TEuDf5ddJfgIHZGb2-BDuoPP6_X8R5rSFfanVuHf6z1_DTjzQ0s32WeB9zw73PelQB8ZCrElMHwRk815k8q5j7STEdabthp9LiEbQEeScF9AgN8cRk6avcchVj86n6airbOZC-LXyyAm_gAmYPY6BLEkKbT3bSY4JHo8KJ2x9ikAEarbGXPnCQlVtlvVxTpjCI1IDMQhxPCbHbtfhUh5lw84BWncHpBc--mOZlEbecM')"></div>

<span class="font-label-sm text-label-sm text-primary-container uppercase tracking-[0.2em] mb-sm block">
                Dear Guest
            </span>
<div class="h-px w-8 bg-primary/30 mb-sm"></div>
<p class="font-body-md text-body-md text-surface/80 max-w-[200px] leading-relaxed">
                Together with their families, joyfully invite you to the wedding of
            </p>
</div>
<!-- Middle Section: Bold Arabic Names & English Translation -->
<div class="relative z-20 flex flex-col items-center w-full animate-fade-up delay-100 my-auto">
<!-- Utilizing the prompt's request for bold Arabic names. If Playfair doesn't render Arabic perfectly, a system fallback will occur, but structure remains sound. -->
<h1 class="font-display-lg-mobile text-display-lg-mobile text-primary-container leading-tight mb-xs" dir="rtl" style="font-family: 'Amiri', serif;">
                عمر و سارة
            </h1>
<div class="flex items-center gap-4 my-md w-full justify-center opacity-80">
<div class="h-px w-12 bg-gradient-to-r from-transparent to-primary"></div>
<span class="font-headline-md text-headline-md text-surface font-light italic text-xl">&amp;</span>
<div class="h-px w-12 bg-gradient-to-l from-transparent to-primary"></div>
</div>
<h2 class="font-display-lg-mobile text-display-lg-mobile text-surface tracking-wide uppercase text-2xl">
                Omar <br/> <span class="text-primary-container text-opacity-80">Sarah</span>
</h2>
</div>

<span class="material-symbols-outlined text-[18px] text-primary">location_on</span>
