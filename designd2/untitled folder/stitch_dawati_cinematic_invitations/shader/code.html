<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width,initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }
  </style>
</head>
<body>
<!-- STITCH_SHADER_START:ANIMATION_15 class="fixed inset-0 w-full h-full" -->
<div class="fixed inset-0 w-full h-full" style="display:block;">
<canvas id="shader-canvas-ANIMATION_15" style="display:block;width:100%;height:100%"></canvas>
<script>
(function() {
  const canvas = document.getElementById('shader-canvas-ANIMATION_15');

  // Sync the WebGL drawing-buffer size with the CSS-driven layout size.
  // This fires on initial layout and whenever the element is resized.
  function syncSize() {
    const w = canvas.clientWidth  || 1280;
    const h = canvas.clientHeight || 720;
    if (canvas.width !== w || canvas.height !== h) {
      canvas.width  = w;
      canvas.height = h;
    }
  }
  if (typeof ResizeObserver !== 'undefined') {
    new ResizeObserver(syncSize).observe(canvas);
  }
  syncSize();

  const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
  if (!gl) return;
  const vs = `attribute vec2 a_position;
varying vec2 v_texCoord;
void main() {
  v_texCoord = a_position * 0.5 + 0.5;
  gl_Position = vec4(a_position, 0.0, 1.0);
}`;
  const fs = `precision highp float;
varying vec2 v_texCoord;
uniform float u_time;
uniform vec2 u_resolution;
uniform vec2 u_mouse;

// Colors derived from Dawati Immersive Experience (Espresso & Champagne)
// Espresso Deep: #19120E -> vec3(0.1, 0.07, 0.05)
// Espresso Mid: #2E1A11 -> vec3(0.18, 0.10, 0.07)
// Champagne Highlight: #E3BFB0 -> vec3(0.89, 0.75, 0.69)

vec3 hash(vec3 p) {
    p = vec3(dot(p, vec3(127.1, 311.7, 74.7)),
             dot(p, vec3(269.5, 183.3, 246.1)),
             dot(p, vec3(113.5, 271.9, 124.6)));
    return -1.0 + 2.0 * fract(sin(p) * 43758.5453123);
}

float noise(vec3 p) {
    vec3 i = floor(p);
    vec3 f = fract(p);
    vec3 u = f * f * (3.0 - 2.0 * f);
    return mix(mix(mix(dot(hash(i + vec3(0,0,0)), f - vec3(0,0,0)),
                       dot(hash(i + vec3(1,0,0)), f - vec3(1,0,0)), u.x),
                   mix(dot(hash(i + vec3(0,1,0)), f - vec3(0,1,0)),
                       dot(hash(i + vec3(1,1,0)), f - vec3(1,1,0)), u.x), u.y),
               mix(mix(dot(hash(i + vec3(0,0,1)), f - vec3(0,0,1)),
                       dot(hash(i + vec3(1,0,1)), f - vec3(1,0,1)), u.x),
                   mix(dot(hash(i + vec3(0,1,1)), f - vec3(0,1,1)),
                       dot(hash(i + vec3(1,1,1)), f - vec3(1,1,1)), u.x), u.y), u.z);
}

void main() {
    vec2 uv = v_texCoord;
    vec2 p = (uv * 2.0 - 1.0);
    p.x *= u_resolution.x / u_resolution.y;

    // Interactive distortion based on mouse
    vec2 m = (u_mouse / u_resolution) * 2.0 - 1.0;
    m.x *= u_resolution.x / u_resolution.y;
    float dist = length(p - m);
    p += (p - m) * exp(-dist * 4.0) * 0.1;

    float t = u_time * 0.15;
    
    // Multi-layered silk flow
    float n1 = noise(vec3(p * 1.5, t));
    float n2 = noise(vec3(p * 3.0 + n1, t * 1.2));
    float n3 = noise(vec3(p * 6.0, t * 0.8));
    
    float silk = n1 * 0.5 + n2 * 0.25 + n3 * 0.125;
    silk = smoothstep(-0.2, 0.8, silk);

    vec3 deepBackground = vec3(0.08, 0.05, 0.04); // Darker Espresso
    vec3 silkColor = vec3(0.18, 0.12, 0.09); // Rich Espresso
    vec3 highlightColor = vec3(0.35, 0.28, 0.24); // Champagne Glow
    
    vec3 finalColor = mix(deepBackground, silkColor, silk);
    
    // Specular highlight streaks
    float streaks = pow(max(0.0, noise(vec3(p.x * 2.0, p.y * 0.5, t * 2.0))), 8.0);
    finalColor = mix(finalColor, highlightColor, streaks * 0.4);

    // Vignette
    float vignette = 1.0 - length(uv - 0.5) * 1.2;
    finalColor *= smoothstep(0.0, 0.6, vignette);

    gl_FragColor = vec4(finalColor, 1.0);
}`;
  function cs(type, src) {
    const s = gl.createShader(type);
    gl.shaderSource(s, src);
    gl.compileShader(s);
    return s;
  }
  const prog = gl.createProgram();
  gl.attachShader(prog, cs(gl.VERTEX_SHADER, vs));
  gl.attachShader(prog, cs(gl.FRAGMENT_SHADER, fs));
  gl.linkProgram(prog);
  gl.useProgram(prog);
  const buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
  const pos = gl.getAttribLocation(prog, 'a_position');
  gl.enableVertexAttribArray(pos);
  gl.vertexAttribPointer(pos, 2, gl.FLOAT, false, 0, 0);
  const uTime = gl.getUniformLocation(prog, 'u_time');
  const uRes = gl.getUniformLocation(prog, 'u_resolution');
  const uMouse = gl.getUniformLocation(prog, 'u_mouse');

  // u_mouse is in pixel coordinates matching u_resolution (ShaderToy convention).
  // Shaders that need normalized coords should use: u_mouse / u_resolution.
  let mouse = { x: canvas.width / 2, y: canvas.height / 2 };
  window.addEventListener('mousemove', (event) => {
    const rect = canvas.getBoundingClientRect();
    if (rect.width && rect.height) {
      const nx = (event.clientX - rect.left) / rect.width;
      const ny = 1.0 - (event.clientY - rect.top) / rect.height;
      mouse.x = nx * canvas.width;
      mouse.y = ny * canvas.height;
    }
  });

  function render(t) {
    if (typeof ResizeObserver === 'undefined') syncSize();
    gl.viewport(0, 0, canvas.width, canvas.height);
    if (uTime) gl.uniform1f(uTime, t * 0.001);
    if (uRes) gl.uniform2f(uRes, canvas.width, canvas.height);
    if (uMouse) gl.uniform2f(uMouse, mouse.x, mouse.y);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
    requestAnimationFrame(render);
  }
  render(0);
})();
</script>
</div>
<!-- STITCH_SHADER_END:ANIMATION_15 -->
</body>
</html>
