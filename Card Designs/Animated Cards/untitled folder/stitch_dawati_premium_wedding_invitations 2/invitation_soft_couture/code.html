<body class="bg-[#FDF9F6] text-on-surface font-body-md h-screen w-full flex items-center justify-center overflow-hidden selection:bg-secondary-container selection:text-on-surface">
<!-- Mobile Canvas (9:16 aspect ratio constraint for desktop viewing, full screen on mobile) -->
<main class="relative w-full h-full max-w-[430px] max-h-[932px] bg-[#F9F3EE] shadow-2xl overflow-hidden mx-auto">
<!-- Background Layered Panels (Dusty Rose & Ivory) -->
<div class="absolute inset-0 z-0">
<!-- Base Rose Panel -->
<div class="absolute -top-[10%] -right-[20%] w-[150%] h-[60%] bg-[#E8D6D6] rounded-full blur-[80px] opacity-60"></div>
<!-- Secondary Panel -->
<div class="absolute bottom-[0%] -left-[30%] w-[120%] h-[70%] bg-[#F3E8E8] rounded-[100px] blur-[60px] opacity-70 transform rotate-12"></div>
<!-- Textured overlay placeholder -->
<div class="absolute inset-0 w-full h-full opacity-30 mix-blend-multiply bg-cover bg-center" data-alt="A delicate, high-resolution watercolor wash texture in pale dusty rose and ivory tones. Subtle paper grain is visible. The lighting is soft and even, creating a romantic and ethereal light-mode aesthetic suitable for a luxury wedding invitation background." style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuD7IIcoc2o56Sh0pGxa2C4un5p6zwr8JL-dH4fTTkQElpNVTVD0vAqxim3-Fo5oKDYnt5WC6HwlwnI2RoLZFkgFmYkuTCW6GEkUGSobXDVnASygIIOCKSqUJMy6lRmV_DI_kCLhyGebyGV-RICba2gPIVrWdsYWGKa87YU3-Y2gGG5g32aXGrTVN4rDvIXF82qX4lEHBOxZWS24xKk8_ZHzBjt_goa10HgN0tt_8WSwpPkoubuu_Wb8')"></div>
</div>
<!-- Main Content Container -->
<div class="relative z-10 w-full h-full flex flex-col justify-between px-margin-mobile py-xl">
<!-- Top Section: Names -->
<header class="text-center mt-lg">
<h1 class="font-display-lg-mobile text-display-lg-mobile text-[#6B5A5A] mb-unit">سارة</h1>
<span class="font-display-lg-mobile text-[24px] text-[#A89090] italic">&amp;</span>
<h1 class="font-display-lg-mobile text-display-lg-mobile text-[#6B5A5A] mt-unit">محمد</h1>
</header>
<!-- Middle Section: Details Card -->
<article class="bg-surface/80 backdrop-blur-xl rounded-2xl p-md flex flex-col items-center text-center soft-shadow border border-[#E8D6D6]/50 mx-xs my-lg relative overflow-hidden">
<!-- Decorative Corner -->
<div class="absolute top-0 right-0 w-16 h-16 bg-gradient-to-bl from-[#E8D6D6]/30 to-transparent"></div>
<p class="font-body-md text-[#8A7878] mb-sm">بكل حب وسعادة يسرنا<br/>دعوتكم لمشاركتنا فرحتنا</p>
<h2 class="font-headline-md text-headline-md text-[#6B5A5A] mb-md pb-xs border-b border-[#E8D6D6]/60 w-3/4">أم خالد</h2>
<div class="flex flex-col gap-y-unit font-label-sm text-label-sm text-[#8A7878] tracking-widest">
<p>السبت 15 نوفمبر 2026</p>
<p>09:00 مساءً</p>
<p>قاعة النخبة - الرياض</p>
</div>
</article>
<!-- Bottom Section: Countdown & QR -->
<footer class="flex flex-col items-center gap-y-md mb-lg">
<div class="flex gap-x-3 text-[#A89090] font-label-sm text-label-sm tracking-[0.2em]">
<div class="flex flex-col items-center">
<span class="text-lg mb-1">12</span>
<span class="text-[8px] uppercase">يوم</span>
</div>
<span class="text-lg opacity-50">:</span>
<div class="flex flex-col items-center">
<span class="text-lg mb-1">08</span>
<span class="text-[8px] uppercase">ساعة</span>
</div>
<span class="text-lg opacity-50">:</span>
<div class="flex flex-col items-center">
<span class="text-lg mb-1">42</span>
<span class="text-[8px] uppercase">دقيقة</span>
</div>
</div>
<!-- QR Code Placeholder (Softly Integrated) -->
<div class="w-16 h-16 bg-[#F3E8E8] rounded-lg p-2 soft-shadow border border-[#E8D6D6]/50 flex items-center justify-center opacity-80 mix-blend-multiply">
<img class="w-full h-full object-contain mix-blend-multiply opacity-60" data-alt="A minimalist, high-resolution QR code styled for a luxury wedding invitation. The QR code is a soft, dusty rose color against an ivory background, with rounded, elegant modules. It blends seamlessly with a feminine, editorial aesthetic." src="https://lh3.googleusercontent.com/aida-public/AB6AXuDJCPSCGsH72zsFt16v299Jl9TqJ6L03HNM1bW_tcLCiF0VrkFnRVx0p-fu_PMbfmkqBwsOtZDwGTS10sN-l1bIrgp6M-rK1jlgQsKzlGnOTEQbNM7lQVLO-ixbC_64sCdTaN5LV-LuJgTGkSMHXTryrfwtKzpztwSLb_f3j_D9Ye5iTLUzQqi5yTeNKhLlylnUv2w2Ml0oLeueD1OgXzeDQYS0rQgAxjKc90OvdXKnDNM18mBV--Gs"/>
