<style>
        /* Fallback for Material Symbols */
        .material-symbols-outlined {
          font-family: 'Material Symbols Outlined';
          font-weight: normal;
          font-style: normal;
          font-size: 24px;  /* Preferred icon size */
          line-height: 1;
          letter-spacing: normal;
          text-transform: none;
          display: inline-block;
          white-space: nowrap;
          word-wrap: normal;
          direction: ltr;
          -webkit-font-feature-settings: 'liga';
          -webkit-font-smoothing: antialiased;
        }
        
        /* Custom styles for this specific invitation */
        .invitation-container {
            aspect-ratio: 9/16;
            max-height: 100vh;
            max-width: calc(100vh * 9 / 16);
            margin: 0 auto;
            position: relative;
            overflow: hidden;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
        }

        .velvet-texture {
            background-color: #4A1525; /* Rich Burgundy Base */
            background-image: 
                radial-gradient(circle at 50% 0%, #6E2239 0%, transparent 70%),
                radial-gradient(circle at 50% 100%, #300C17 0%, transparent 80%);
            /* Adding a subtle noise texture overlay for velvet feel */
            position: absolute;
            inset: 0;
            z-index: -1;
        }
        
        .velvet-texture::after {
            content: "";
            position: absolute;
            inset: 0;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.15'/%3E%3C/svg%3E");
            mix-blend-mode: overlay;
        }

        /* Gold Foil effect for specific elements */
        .gold-foil-text {
            background: linear-gradient(to right, #E5D3B3 0%, #F3E0C0 40%, #FFFFFF 50%, #F3E0C0 60%, #E5D3B3 100%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-shadow: 0 1px 2px rgba(0,0,0,0.1);
        }

        .gold-line {
            height: 1px;
            background: linear-gradient(to right, transparent, #E5D3B3, transparent);
            width: 80%;
            margin: 0 auto;
        }
        
        .text-ivory {
            color: #F8F5F0;
        }

        body {
            /* Full screen background for the demo page itself to contrast with the card */
            background-color: #1a1a1a;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
    </style>
</head>
<!-- No navigation shell as this is a standalone transactional/view screen -->
<body class="antialiased">
<!-- The 9:16 Invitation Card -->
<main class="invitation-container w-full bg-surface relative rounded-xl sm:rounded-2xl">
<!-- Velvet Background Layer -->
<div class="velvet-texture"></div>
<!-- Inner Content Canvas -->
<div class="absolute inset-0 p-8 flex flex-col justify-between items-center text-center z-10">
<!-- Top Section: Bismillah & Intro -->
<div class="mt-8 flex flex-col items-center gap-6 w-full opacity-0 translate-y-4 animate-[fadeInUp_1s_ease-out_0.2s_forwards]">
<!-- Bismillah / Logo Placeholder (Arabic script or simple elegant icon) -->
<div class="w-16 h-16 rounded-full border border-primary-container/30 flex items-center justify-center">
<span class="material-symbols-outlined gold-foil-text text-3xl" data-icon="favorite">favorite</span>
</div>
<p class="font-label-sm text-label-sm tracking-[0.2em] uppercase text-primary-container/80">
                    With joyous hearts, we invite you
                </p>
</div>
<!-- Middle Section: The Names (Primary Focus) -->
<div class="flex flex-col items-center gap-8 w-full my-auto opacity-0 translate-y-4 animate-[fadeInUp_1s_ease-out_0.5s_forwards]">
<div class="flex flex-col items-center gap-2">
<h1 class="font-display-lg-mobile text-display-lg-mobile md:font-display-lg md:text-display-lg gold-foil-text tracking-wider">
                        Faisal
                    </h1>
<span class="font-headline-md text-headline-md text-primary-container/60 italic">&amp;</span>
<h1 class="font-display-lg-mobile text-display-lg-mobile md:font-display-lg md:text-display-lg gold-foil-text tracking-wider">
                        Noura
                    </h1>
</div>
<div class="gold-line"></div>
<p class="font-body-md text-body-md text-ivory/90 max-w-[80%] mx-auto font-light leading-relaxed">
                    To celebrate their wedding reception and the beginning of their new life together.
                </p>
</div>
<!-- Bottom Section: Details & QR -->
<div class="w-full flex flex-col items-center gap-8 mb-8 opacity-0 translate-y-4 animate-[fadeInUp_1s_ease-out_0.8s_forwards]">
<!-- Date, Time, Location Block -->
<div class="grid grid-cols-3 w-full border-y border-primary-container/20 py-6 gap-4">
<div class="flex flex-col items-center gap-2">
<span class="font-label-sm text-label-sm text-primary-container/70 uppercase">Friday</span>
<span class="font-headline-md text-headline-md text-ivory">24</span>
<span class="font-label-sm text-label-sm text-primary-container/70 uppercase">November</span>
</div>
<div class="flex flex-col items-center justify-center border-x border-primary-container/20 px-2">
<span class="font-label-sm text-label-sm text-primary-container/70 uppercase mb-1">Time</span>
<span class="font-body-md text-body-md text-ivory">8:00 PM</span>
</div>
<div class="flex flex-col items-center justify-center gap-1">
<span class="material-symbols-outlined text-primary-container text-xl" data-icon="location_on">location_on</span>
<span class="font-label-sm text-label-sm text-ivory text-center">Ritz Carlton<br/>Riyadh</span>
</div>
</div>
<!-- Footer: RSVP / QR -->
<div class="flex flex-col items-center gap-4 w-full">
<p class="font-label-sm text-label-sm tracking-[0.1em] text-primary-container/60 uppercase">
                        Scan to RSVP &amp; Details
                    </p>
<!-- Decorative Frame around QR -->
<div class="p-2 border border-primary-container/30 rounded bg-white/5 backdrop-blur-sm">
<!-- Generative image placeholder for an elegant QR code design -->
<div class="bg-cover bg-center w-20 h-20 bg-white" data-alt="A minimalist, highly elegant black and white QR code design, framed within a thin gold border. The QR code should look scannable but stylized to fit a luxury wedding invitation, set against a completely transparent or crisp white background. Minimalist aesthetic, flat lighting." style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuDbpdVi2T4k4MKrip_C03-Z4EM0V93LiIVcu4yIec8Y08O37B8SJrfvE1fCjQ7w8p5OwKkqdfJnzbdIh_TxLqWw6DBolppt9rvgHsbrrUnX1eh1UXjRJFGJ-oawEs-8cIqJ1_QWO3a9gd_nfJeuy4RRkjKUTUwsmhwJGfzoKA-3TLun6scoySH9XZLJGTKkCwWVR9kHfhSLQQeO8qq9KD5XoeTqpJavi6CczU7d-Dxq1jSzUxdNJzse')"></div>
</div>
</div>
</div>
<!-- Corner Decorative Elements (Optional touch of traditional luxury) -->
<div class="absolute top-4 left-4 border-t border-l border-primary-container/40 w-8 h-8 rounded-tl-lg"></div>
<div class="absolute top-4 right-4 border-t border-r border-primary-container/40 w-8 h-8 rounded-tr-lg"></div>
<div class="absolute bottom-4 left-4 border-b border-l border-primary-container/40 w-8 h-8 rounded-bl-lg"></div>
<div class="absolute bottom-4 right-4 border-b border-r border-primary-container/40 w-8 h-8 rounded-br-lg"></div>
</div>
</main>
<style>
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</body></html>
