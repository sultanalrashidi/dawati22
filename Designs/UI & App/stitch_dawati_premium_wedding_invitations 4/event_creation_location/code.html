<body class="min-h-screen flex flex-col font-body-md">
<!-- Top Navigation for Linear Flow -->
<header class="w-full flex justify-between items-center px-margin-mobile md:px-margin-desktop h-20 bg-surface/80 backdrop-blur-xl fixed top-0 z-50">
<button aria-label="Go back" class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-surface-variant transition-colors">
<span class="material-symbols-outlined text-on-surface">arrow_back</span>
</button>
<span class="font-label-sm text-label-sm text-on-surface-variant tracking-widest uppercase">Step 3 of 4</span>
<button aria-label="Close" class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-surface-variant transition-colors">
<span class="material-symbols-outlined text-on-surface">close</span>
</button>
</header>
<!-- Main Content Canvas -->
<main class="flex-grow flex flex-col items-center justify-center px-margin-mobile md:px-margin-desktop pt-24 pb-32">
<div class="w-full max-w-2xl flex flex-col md:flex-row gap-lg">
<!-- Left Column: Form -->
<div class="flex-1 flex flex-col justify-center">
<div class="mb-lg text-center md:text-left">
<h1 class="font-display-lg-mobile md:font-display-lg text-display-lg-mobile md:text-display-lg text-on-surface mb-xs">Where is the celebration?</h1>
<p class="font-body-lg text-body-lg text-on-surface-variant">Enter the venue details to help guests find their way.</p>
</div>
<form class="space-y-md">
<div class="flex flex-col">
<label class="font-label-sm text-label-sm text-on-surface-variant mb-unit" for="venueName">Venue Name</label>
<input class="input-underline font-body-lg text-body-lg text-on-surface w-full" id="venueName" placeholder="e.g., The Ritz-Carlton" type="text"/>
</div>
<div class="flex flex-col">
<label class="font-label-sm text-label-sm text-on-surface-variant mb-unit" for="city">City</label>
<input class="input-underline font-body-lg text-body-lg text-on-surface w-full" id="city" placeholder="e.g., Riyadh" type="text"/>
</div>
<div class="flex flex-col">
<label class="font-label-sm text-label-sm text-on-surface-variant mb-unit" for="address">Address (Optional)</label>
<input class="input-underline font-body-lg text-body-lg text-on-surface w-full" id="address" placeholder="Street name, District" type="text"/>
</div>
</form>
</div>
<!-- Right Column: Visual Inspiration / Map Placeholder -->
<div class="flex-1 hidden md:flex flex-col justify-center items-center">
<div class="relative w-full aspect-[4/5] rounded-xl overflow-hidden shadow-sm border border-surface-variant">
<img alt="Premium Event Setup" class="absolute inset-0 w-full h-full object-cover" src="https://lh3.googleusercontent.com/aida/AP1WRLtfvt2ExaUmv2abNK45VTswCTn9H61qURCXuo0XMo6NQ_qeluxvd2VaM_XGNw8vnefn2x4w9r32cOdBVpwMVH0Ufb8nEiwpLNFx5EO37140acLzxBetaoLMp20nyhQVqxQ5NnCgOQyi6b2ulenCfYsSsXUAiqZ6r0FpAX4Ccvd6WM0V79qluqaiPZXQEfb34LQIPbAPjp64xD1ap3afJOkVbrpCkPuZDbAI9nUeP0aCKxrQEJz-61EgAg"/>
<!-- Overlay for map-like feel -->
<div class="absolute inset-0 bg-surface/20 backdrop-blur-[2px] flex items-center justify-center transition-all duration-300 hover:backdrop-blur-none group cursor-pointer">
<div class="w-16 h-16 bg-surface/90 backdrop-blur-md rounded-full flex items-center justify-center shadow-lg group-hover:scale-110 transition-transform">
<span class="material-symbols-outlined text-primary text-3xl">location_on</span>
</div>
</div>
</div>
</div>
</div>
</main>
<!-- Bottom Action Bar (Fixed for Mobile, static for Desktop if needed, but keeping fixed for linear flow) -->
<footer class="fixed bottom-0 w-full bg-surface/90 backdrop-blur-xl border-t border-surface-variant px-margin-mobile md:px-margin-desktop py-md z-40 flex justify-end">
<button class="bg-primary-container text-on-primary-container font-label-sm text-label-sm py-4 px-8 rounded-full flex items-center gap-2 hover:scale-95 transition-transform duration-200 btn-primary-glow uppercase tracking-widest">

</button>
</footer>
