<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 24;
        }
        .material-symbols-outlined.filled {
            font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        
        /* Subtle Entrance Animations */
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-up {
            animation: fadeUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            opacity: 0;
        }
        .stagger-1 { animation-delay: 0.1s; }
        .stagger-2 { animation-delay: 0.2s; }
        .stagger-3 { animation-delay: 0.3s; }
        .stagger-4 { animation-delay: 0.4s; }
        
        /* Input Focus Transition */
        .input-line {
            transform-origin: left;
            transform: scaleX(0);
            transition: transform 0.3s ease;
        }
        input:focus ~ .input-line {
            transform: scaleX(1);
        }
        input:not(:placeholder-shown) ~ .input-line {
            transform: scaleX(1);
        }
    </style>

<body class="bg-background text-on-background min-h-screen antialiased flex flex-col font-body-md selection:bg-primary-container selection:text-on-primary-container">
<!-- Top Navigation (Suppressed for purely linear flow, but required to render TopAppBar for brand anchor if it wasn't a strict transactional screen. Given instruction: "Automatic Suppression: You MUST exclude the navigation shell if the page intent is: Linear/Transactional: Login...". Therefore, no TopAppBar or BottomNavBar.) -->
<!-- Main Canvas -->
<main class="flex-grow flex items-center justify-center p-margin-mobile md:p-margin-desktop relative overflow-hidden min-h-[100dvh]">
<!-- Subtle Background Glow -->
<div class="absolute top-0 left-1/2 -translate-x-1/2 w-full max-w-3xl h-full pointer-events-none overflow-hidden">
<div class="absolute top-[-10%] left-[-10%] w-[50%] h-[50%] rounded-full bg-primary-container/20 blur-[100px]"></div>
<div class="absolute bottom-[-10%] right-[-10%] w-[50%] h-[50%] rounded-full bg-secondary-container/20 blur-[100px]"></div>
</div>
<!-- Sign In Container -->
<div class="w-full max-w-md relative z-10">
<!-- Brand & Greeting -->
<div class="text-center mb-12 animate-fade-up">
<h1 class="font-headline-md text-display-lg-mobile md:text-display-lg text-primary mb-xs tracking-tight">Dawati | دعوتي</h1>
<p class="font-body-lg text-on-surface-variant/80">Welcome back. Please enter your details.</p>
</div>
<!-- Form -->
<form class="space-y-lg animate-fade-up stagger-1" onsubmit="event.preventDefault();">
<!-- Input Group: Email -->
<div class="relative group pb-unit">
<label class="block font-headline-md text-headline-md text-on-surface mb-xs transition-colors group-focus-within:text-primary" for="email">Email Address</label>
<div class="relative">
<input class="w-full bg-transparent border-0 border-b border-surface-variant px-0 py-sm font-body-md text-on-surface focus:ring-0 focus:border-transparent placeholder-transparent transition-all peer" id="email" name="email" placeholder=" " required="" type="email"/>
<!-- Custom animated bottom line -->
<div class="input-line absolute bottom-0 left-0 w-full h-[2px] bg-primary"></div>
</div>
</div>
<!-- Input Group: Password -->
<div class="relative group pb-unit">
<div class="flex justify-between items-baseline mb-xs">
<label class="block font-headline-md text-headline-md text-on-surface transition-colors group-focus-within:text-primary" for="password">Password</label>
</div>
<div class="relative">
<input class="w-full bg-transparent border-0 border-b border-surface-variant px-0 py-sm font-body-md text-on-surface focus:ring-0 focus:border-transparent placeholder-transparent transition-all peer pr-10" id="password" name="password" placeholder=" " required="" type="password"/>
<button aria-label="Toggle password visibility" class="absolute right-0 top-1/2 -translate-y-1/2 text-on-surface-variant/50 hover:text-on-surface transition-colors" type="button">
<span class="material-symbols-outlined text-[20px]" data-icon="visibility_off">visibility_off</span>
</button>
<!-- Custom animated bottom line -->
<div class="input-line absolute bottom-0 left-0 w-full h-[2px] bg-primary"></div>
</div>
<!-- Forgot Password Link -->
<div class="mt-xs text-right">
<a class="font-label-sm text-label-sm text-on-surface-variant hover:text-primary transition-colors inline-flex items-center gap-unit" href="#">
                            Forgot password?
                        </a>
</div>
</div>
<!-- Actions -->
<div class="pt-sm space-y-sm animate-fade-up stagger-2">
<button class="w-full bg-primary-container text-on-primary-container font-label-sm text-label-sm py-4 px-md rounded-lg hover:scale-[0.98] transition-transform duration-200 shadow-[0_20px_40px_rgba(229,211,179,0.15)] flex justify-center items-center gap-xs group" type="submit">
                        Sign In
                        <span class="material-symbols-outlined text-[16px] group-hover:translate-x-1 transition-transform" data-icon="arrow_forward">arrow_forward</span>
</button>
</div>
</form>
<!-- Divider -->
<div class="flex items-center my-lg animate-fade-up stagger-3">
<div class="flex-grow h-px bg-on-surface/5"></div>
<span class="px-md font-label-sm text-label-sm text-on-surface-variant/50 uppercase tracking-widest">or</span>
<div class="flex-grow h-px bg-on-surface/5"></div>
</div>
<!-- Sign Up Prompt -->
<div class="text-center animate-fade-up stagger-4">
<p class="font-body-md text-on-surface-variant">
                    Don't have an account? 
                    <a class="text-primary font-medium hover:opacity-80 transition-opacity border-b border-primary/30 pb-unit" href="#">Create one</a>
</p>
</div>
</div>
</main>
<script>
        // Simple password toggle logic
        document.addEventListener('DOMContentLoaded', () => {
            const toggleBtn = document.querySelector('button[aria-label="Toggle password visibility"]');
            const passwordInput = document.getElementById('password');
            const icon = toggleBtn.querySelector('.material-symbols-outlined');

            if (toggleBtn && passwordInput && icon) {
                toggleBtn.addEventListener('click', () => {
                    const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
                    passwordInput.setAttribute('type', type);
                    
                    if (type === 'text') {
                        icon.textContent = 'visibility';
                        icon.setAttribute('data-icon', 'visibility');
                    } else {
                        icon.textContent = 'visibility_off';
                        icon.setAttribute('data-icon', 'visibility_off');
                    }
                });
            }
        });
    </script>
