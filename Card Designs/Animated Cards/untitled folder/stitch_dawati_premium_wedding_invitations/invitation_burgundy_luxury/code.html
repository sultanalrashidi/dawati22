<!DOCTYPE html>

<html dir="rtl" lang="ar"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Invitation Card - Burgundy Luxury</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;500;700&amp;family=Playfair+Display:wght@400;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-error-container": "#93000a",
                        "secondary-container": "#fdcbcb",
                        "on-background": "#1b1c1c",
                        "on-primary-container": "#675a41",
                        "inverse-primary": "#d6c4a5",
                        "on-tertiary": "#ffffff",
                        "surface-container-lowest": "#ffffff",
                        "secondary": "#7b5455",
                        "primary-fixed": "#f3e0c0",
                        "surface-container-low": "#f6f3f2",
                        "primary-fixed-dim": "#d6c4a5",
                        "inverse-surface": "#303030",
                        "primary": "#6a5d43",
                        "on-secondary-fixed-variant": "#603d3e",
                        "error-container": "#ffdad6",
                        "inverse-on-surface": "#f3f0f0",
                        "tertiary-fixed-dim": "#c4c5d9",
                        "outline": "#7d766c",
                        "surface-container": "#f0eded",
                        "surface-tint": "#6a5d43",
                        "on-tertiary-container": "#595b6c",
                        "tertiary": "#5b5d6e",
                        "on-primary-fixed": "#231a06",
                        "on-error": "#ffffff",
                        "tertiary-fixed": "#e0e1f5",
                        "surface-variant": "#e4e2e1",
                        "surface-dim": "#dcd9d9",
                        "surface": "#fcf9f8",
                        "secondary-fixed": "#ffdad9",
                        "error": "#ba1a1a",
                        "on-secondary": "#ffffff",
                        "on-tertiary-fixed-variant": "#434656",
                        "on-surface": "#1b1c1c",
                        "primary-container": "#e5d3b3",
                        "on-primary-fixed-variant": "#51452d",
                        "on-secondary-container": "#795354",
                        "on-surface-variant": "#4c463d",
                        "on-tertiary-fixed": "#181b29",
                        "tertiary-container": "#d3d4e8",
                        "outline-variant": "#cec5b9",
                        "surface-container-high": "#eae7e7",
                        "surface-bright": "#fcf9f8",
                        "on-primary": "#ffffff",
                        "secondary-fixed-dim": "#ecbbba",
                        "surface-container-highest": "#e4e2e1",
                        "background": "#fcf9f8",
                        "on-secondary-fixed": "#2f1314",
                        "burgundy": "#501A20", // Added custom colors for the specific request
                        "ivory": "#FDFBF7",
                        "gold": "#D4AF37"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "lg": "48px",
                        "sm": "16px",
                        "unit": "4px",
                        "md": "24px",
                        "margin-mobile": "20px",
                        "margin-desktop": "120px",
                        "xs": "8px",
                        "gutter": "20px",
                        "xl": "80px"
                    },
                    "fontFamily": {
                        "label-sm": ["DM Sans"],
                        "headline-md": ["Playfair Display"],
                        "body-md": ["DM Sans"],
                        "display-lg": ["Playfair Display"],
                        "body-lg": ["DM Sans"],
                        "display-lg-mobile": ["Playfair Display"]
                    },
                    "fontSize": {
                        "label-sm": ["12px", { "lineHeight": "1.0", "letterSpacing": "0.05em", "fontWeight": "500" }],
                        "headline-md": ["24px", { "lineHeight": "1.3", "fontWeight": "500" }],
                        "body-md": ["16px", { "lineHeight": "1.5", "fontWeight": "400" }],
                        "display-lg": ["48px", { "lineHeight": "1.1", "letterSpacing": "-0.02em", "fontWeight": "600" }],
                        "body-lg": ["18px", { "lineHeight": "1.6", "fontWeight": "400" }],
                        "display-lg-mobile": ["32px", { "lineHeight": "1.2", "fontWeight": "600" }]
                    }
                }
            }
        }
    </script>
<style>
        .texture-overlay {
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.15'/%3E%3C/svg%3E");
            mix-blend-mode: overlay;
        }
        
        .gold-border {
            border: 2px solid transparent;
            border-image: linear-gradient(to bottom, #f3e0c0, #a38b55, #f3e0c0) 1;
        }
        
        /* Simulating Arabic Calligraphy feel with Playfair for now, though a real web font would be better */
        .calligraphy {
            font-family: 'Playfair Display', serif;
        }
    </style>
</head>
<body class="bg-black flex items-center justify-center min-h-screen p-4 m-0 overflow-hidden font-body-md text-on-background">
<!-- Container matching aspect ratio 9:16 -->
<div class="relative w-full max-w-[400px] aspect-[9/16] bg-burgundy rounded-[2rem] overflow-hidden shadow-2xl gold-border flex flex-col items-center justify-between py-12 px-8 text-center text-ivory">
<!-- Texture Overlay -->
<div class="absolute inset-0 texture-overlay pointer-events-none z-0"></div>
<!-- Subtle gold inner frame -->
<div class="absolute inset-4 border border-[#D4AF37]/30 rounded-xl pointer-events-none z-0"></div>
<div class="absolute inset-5 border border-[#D4AF37]/10 rounded-lg pointer-events-none z-0"></div>
<!-- Content Wrapper (z-10 to stay above texture) -->
<div class="relative z-10 flex flex-col items-center justify-between h-full w-full">
<!-- Top Section: Names -->
<div class="flex flex-col items-center space-y-4 mt-8">
<h1 class="calligraphy text-display-lg-mobile md:text-display-lg text-ivory leading-tight drop-shadow-md">
                    سارة<br/>
<span class="text-[#D4AF37] text-headline-md">&amp;</span><br/>
                    محمد
                </h1>
<p class="font-body-md text-[#D4AF37]/80 mt-6 max-w-[200px]">
                    بكل حب وسعادة يسرنا دعوتكم لمشاركتنا فرحتنا
                </p>
<h2 class="font-headline-md text-ivory mt-4">
                    أم خالد
                </h2>
</div>
<!-- Middle Section: Details -->
<div class="flex flex-col items-center space-y-2 mt-auto mb-8 w-full border-t border-b border-[#D4AF37]/30 py-6">
<p class="font-body-md text-ivory">السبت 15 نوفمبر 2026</p>
<p class="font-body-md text-[#D4AF37]">09:00 مساءً</p>
<p class="font-body-md text-ivory">قاعة النخبة - الرياض</p>
</div>
<!-- Bottom Section: Countdown & QR -->
<div class="flex flex-col items-center space-y-6 w-full">
<div class="font-headline-md tracking-widest text-[#D4AF37]">
                    12 : 08 : 42
                </div>
<div class="w-24 h-24 bg-white/10 p-2 rounded-lg border border-[#D4AF37]/50 backdrop-blur-sm flex items-center justify-center relative group cursor-pointer transition-transform hover:scale-105 duration-300">
<!-- Placeholder for QR Code. Using an icon to represent it -->
<span class="material-symbols-outlined text-[#D4AF37] text-[40px]">qr_code_2</span>
<div class="absolute inset-0 bg-[#D4AF37]/10 rounded-lg opacity-0 group-hover:opacity-100 transition-opacity"></div>
</div>
</div>
</div>
</div>
</body></html>
