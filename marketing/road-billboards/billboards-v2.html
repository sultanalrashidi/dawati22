<title>لوحات دعوتي v2</title>
<!--
  النسخة الثانية من لوحات الطرق: بأسلوب لوحات الشاشات على الجسور (خط عريض، السطر الثاني داخل صندوق ملوّن، الشعار كبير على اليمين).
  ?board=1..10   رقم العبارة
  &w=3300        عرض اللوحة بالبكسل (الارتفاع دايماً 600)، عشان تطابق مقاس اللوحة في الصورة
  &theme=dark    خلفية بنية بدل البيضاء
-->

  @font-face { font-family: 'Almarai'; font-weight: 700; src: url('fonts/almarai-700-ar.woff2') format('woff2'); unicode-range: U+0600-06FF, U+200C-200E, U+FB50-FDFF, U+FE70-FEFC; }

  .word { font: 700 104px/1 'Aref Ruqaa', serif; color: var(--glyph); margin-top: 6px; }
  .sep { flex: 0 0 auto; width: 9px; height: 430px; background: var(--gold); transform: skewX(-16deg); }
  .copy {
    flex: 0 0 auto; padding: 0 100px 0 60px;
    display: flex; flex-direction: column; align-items: flex-start; gap: 34px;
  }
  .l1 { font: 800 170px/1.08 'Almarai', sans-serif; color: var(--l1); white-space: nowrap; }
  .l2 {
    font: 800 128px/1 'Almarai', sans-serif; color: var(--l2); white-space: nowrap;
    background: var(--box); padding: 26px 48px 38px; border-radius: 10px;
  }
  .side {
    margin-inline-start: auto; height: 100%; padding: 0 90px 70px;
    display: flex; flex-direction: column; justify-content: flex-end; align-items: flex-end; gap: 22px;
  }
  .dots { display: flex; gap: 16px; direction: ltr; }
  .dots b { width: 22px; height: 22px; background: var(--gold); transform: rotate(45deg); display: block; }
  .dots b:nth-child(2) { opacity: .6; } .dots b:nth-child(3) { opacity: .3; }
  .url { font: 700 62px/1 'Almarai', sans-serif; color: var(--url); direction: ltr; letter-spacing: .02em; }
</style>
</head>
<body>
<script>
  const BOARDS = [
    { l1: 'ضاع الكرت.. وضاع معه العنوان', l2: 'دعوتك توصل برسالة وما تضيع' },
    { l1: 'لا تقول: نسيت الموعد', l2: 'ينضاف لتقويم جوالك بضغطة' },
    { l1: 'أكثر سؤال سمعته: وين القاعة؟', l2: 'الموقع والموعد داخل الدعوة' },
    { l1: 'هاجسي ليلة الفرح: مين بيجي؟', l2: 'الردود توصلك أول بأول' },
    { l1: 'بعض الحضور فرحة..', l2: 'وتأكيده راحة بال' },
    { l1: 'اللمّة ما تكمل إلا فيك', l2: 'أكّد حضورك.. ننتظرك' },
    { l1: 'أحلى بداية: اسمك على الدعوة', l2: 'كل ضيف دعوته باسمه' },
    { l1: 'كرت الفرح صار في جيبك', l2: 'بمحفظة جوالك مع الباركود' },
    { l1: 'ليلة انتظرناها عمر..', l2: 'تستاهل دعوة تليق فيها' },
    { l1: 'أخاف أنسى أحد أعزمه..', l2: 'ضيوفك كلهم في قائمة وحدة' },
  ];
  const q = new URLSearchParams(location.search);
  const b = BOARDS[(Number(q.get('board')) || 1) - 1];
  const W = Number(q.get('w')) || 3300;
  document.body.innerHTML = `<div class="board ${q.get('theme') === 'dark' ? 'dark' : ''}" style="width:${W}px">
    <div class="brand"><div class="mark"><i></i></div><div class="word">دعوتي</div></div>
    <div class="sep"></div>
    <div class="copy"><div class="l1">${b.l1}</div><div class="l2">${b.l2}</div></div>
    <div class="side"><div class="dots"><b></b><b></b><b></b></div><div class="url">dawati.store</div></div>
  </div>`;
  Promise.all([
    document.fonts.load('800 10px Almarai', 'أ'), document.fonts.load('700 10px Almarai', 'a'),
    document.fonts.load('700 10px "Aref Ruqaa"', 'د'),
  ]).then(() => {
    // يصغّر الخط إذا العبارة أطول من المساحة، ويخلي مكان للرابط على اليسار
    const board = document.querySelector('.board'), copy = board.querySelector('.copy');
    const room = W - 540 - 9 - 520;
    let s = 1;
    while (copy.scrollWidth > room && s > 0.5) {
      s -= 0.02;
      board.querySelector('.l1').style.fontSize = 170 * s + 'px';
      board.querySelector('.l2').style.fontSize = 128 * s + 'px';
    }
    window.__ready = true;
  });
</script>
</body>
</html>
